<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #hcp-wrap { position: absolute; top: 44px; left: 56px; }
  #hcp-scrim { position: absolute; top: -50px; left: -80px; width: 640px; height: 340px;
    background: radial-gradient(ellipse at 30% 45%, rgba(4,6,10,.55) 0%, rgba(4,6,10,0) 72%);
    pointer-events: none; }
  #hcp-chip { position: relative; display: flex; align-items: center; gap: 12px; }
  #hcp-bar { width: 4px; height: 20px; background: #e5484d; border-radius: 2px;
    box-shadow: 0 0 12px rgba(229,72,77,.8); }
  #hcp-en { color: #ff6b70; font-size: 22px; font-weight: 800; letter-spacing: 7px;
    text-shadow: 0 2px 12px rgba(0,0,0,.85); }
  #hcp-sub { position: relative; margin-top: 8px; color: #aeb4c2; font-size: 17px; font-weight: 600;
    letter-spacing: 3px; text-shadow: 0 2px 10px rgba(0,0,0,.85); }
  #hcp-list { position: relative; margin-top: 44px; display: flex; flex-direction: column; gap: 30px; }
  .hcp-item { display: flex; align-items: center; gap: 16px; }
  .hcp-x { width: 40px; height: 40px; border-radius: 10px; flex: none;
    background: rgba(229,72,77,.18); border: 1.5px solid rgba(229,72,77,.75);
    display: flex; align-items: center; justify-content: center;
    color: #ff6b70; font-size: 22px; font-weight: 900;
    box-shadow: 0 0 18px rgba(229,72,77,.4); }
  .hcp-t { color: #fff; font-size: 27px; font-weight: 800; letter-spacing: 1px;
    text-shadow: 0 2px 14px rgba(0,0,0,.85); }


</style>
</head>
<body>
<div id="stage">
<div id="hcp" class="clip beat" data-start="0.4" data-duration="4.8" data-track-index="0" data-layout-allow-overflow>
  <div id="hcp-wrap">
    <div id="hcp-scrim"></div>
    <div id="hcp-chip"><div id="hcp-bar"></div><div id="hcp-en">WHY OPEN SOURCE · 为什么开源</div></div>
    <div id="hcp-sub">常见的做法——</div>
    <div id="hcp-list">
      <div class="hcp-item"><div class="hcp-x">✕</div><div class="hcp-t">工具没试过就下结论</div></div>
      <div class="hcp-item"><div class="hcp-x">✕</div><div class="hcp-t">用网页生成的稿子照着念</div></div>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  /* ===== 红✕否定清单（0.4 起，✕ 砸入带震屏）===== */
  (function () {
    var t0 = 0.4;
    tl.from("#hcp-scrim", { autoAlpha: 0, duration: 0.5 }, t0);
    tl.from("#hcp-bar", { scaleY: 0, duration: 0.35 }, t0 + 0.05);
    tl.from("#hcp-en", { autoAlpha: 0, x: -26, duration: 0.45 }, t0 + 0.1);
    tl.from("#hcp-sub", { autoAlpha: 0, y: 12, duration: 0.4 }, t0 + 0.3);
    /* 每条：✕ scale 砸入 + 文字滑入 + 整组轻微震屏 */
    [0, 1].forEach(function (i) {
      var at = t0 + 0.9 + i * 1.3;
      tl.from("#hcp-list .hcp-item:nth-child(" + (i + 1) + ") .hcp-x",
        { autoAlpha: 0, scale: 2.0, rotation: 18, duration: 0.4, ease: "power3.in" }, at);
      tl.from("#hcp-list .hcp-item:nth-child(" + (i + 1) + ") .hcp-t",
        { autoAlpha: 0, x: -20, duration: 0.4 }, at + 0.15);
      tl.fromTo("#hcp-wrap", { x: 0 }, { x: 4, duration: 0.05, yoyo: true, repeat: 3 }, at + 0.38);
    });
    tl.to("#hcp-wrap", { autoAlpha: 0, x: -26, duration: 0.4, ease: "power2.in" }, t0 + 4.2);
  })();


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
