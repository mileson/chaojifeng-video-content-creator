<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #scrim {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(5, 8, 14, 0.88) 0%, rgba(5, 8, 14, 0.72) 36%, rgba(5, 8, 14, 0.3) 58%, transparent 75%);
  }
  #hud-tag { position: absolute; top: 70px; left: 80px; }
  #hud-tag .row1 { display: flex; align-items: center; gap: 14px; }
  #hud-tag .pill { background: #d6409f; color: #fff; border-radius: 8px; font-size: 24px; font-weight: 900; letter-spacing: 3px; padding: 6px 16px; }
  #hud-tag .en {
    color: #3e9eff; font-size: 26px; font-weight: 800; letter-spacing: 7px;
    border-left: 4px solid #3e9eff; padding-left: 14px;
    text-shadow: 0 0 14px rgba(62, 158, 255, 0.55);
  }
  #hud-tag .cn { color: #c8cad3; font-size: 24px; font-weight: 700; margin-top: 10px; letter-spacing: 2px; }
  #ed-title { position: absolute; top: 190px; left: 80px; }
  #ed-title .big { color: #fff; font-size: 108px; font-weight: 900; line-height: 1.05; text-shadow: 0 6px 30px rgba(0,0,0,.55); }
  #ed-title .sub { color: #3e9eff; font-size: 32px; font-weight: 800; letter-spacing: 9px; margin-top: 14px; text-shadow: 0 0 16px rgba(62,158,255,.55); }
  #ed-title .cn { color: #e3e4e8; font-size: 30px; font-weight: 700; margin-top: 12px; letter-spacing: 3px; }
  #ed-badges { position: absolute; top: 520px; left: 80px; display: flex; gap: 18px; }
  #ed-badges .badge {
    border: 1.5px solid rgba(255, 255, 255, 0.38); border-radius: 10px;
    padding: 14px 22px 12px; background: rgba(10, 12, 18, 0.45); will-change: transform;
  }
  #ed-badges .badge .en { font-size: 22px; font-weight: 900; letter-spacing: 3px; display: flex; align-items: center; gap: 10px; }
  #ed-badges .badge .en::before { content: ""; width: 4px; height: 22px; display: inline-block; }
  #ed-badges .badge.b1 .en { color: #3e9eff; } #ed-badges .badge.b1 .en::before { background: #3e9eff; }
  #ed-badges .badge.b2 .en { color: #46d390; } #ed-badges .badge.b2 .en::before { background: #46d390; }
  #ed-badges .badge.b3 .en { color: #ffb224; } #ed-badges .badge.b3 .en::before { background: #ffb224; }
  #ed-badges .badge .cn { color: #fff; font-size: 25px; font-weight: 700; margin-top: 8px; }


</style>
</head>
<body>
<div id="stage">
<div id="scrim"></div>
<div id="hud-tag">
  <div class="row1"><span class="pill">【章节 · 01】</span><span class="en">【ENGLISH TAG】</span></div>
  <div class="cn">【中文角标说明】</div>
</div>
<div id="ed-title">
  <div class="big">【超大标题】</div>
  <div class="sub">【ENGLISH SUBTITLE · KEY FACT】</div>
  <div class="cn">【中文副标题】</div>
</div>
<div id="ed-badges">
  <div class="badge b1"><div class="en">【TAG ONE】</div><div class="cn">【标签一】</div></div>
  <div class="badge b2"><div class="en">【TAG TWO】</div><div class="cn">【标签二】</div></div>
  <div class="badge b3"><div class="en">【TAG THREE】</div><div class="cn">【标签三】</div></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  // 需 gsap.registerPlugin(SplitText)
  const b = gsap.timeline({ defaults: { ease: "power3.out" } });
  const split = SplitText.create("#ed-title .big", { type: "chars" });
  b.from("#scrim", { autoAlpha: 0, duration: 0.5, ease: "power1.out" }, 0)
   .from("#hud-tag", { x: -60, autoAlpha: 0, duration: 0.45 }, 0.1)
   .from(split.chars, { y: 90, autoAlpha: 0, duration: 0.55, ease: "power4.out", stagger: { each: 0.06, from: "start" } }, 0.35)
   .from("#ed-title .sub", { x: -50, autoAlpha: 0, duration: 0.45 }, "<0.35")
   .from("#ed-title .cn", { x: -40, autoAlpha: 0, duration: 0.4 }, "<0.12")
   .from("#ed-badges .badge", { y: 50, autoAlpha: 0, duration: 0.45, ease: "back.out(1.5)", stagger: 0.14 }, 1.4)
   // 退场：文字先走，scrim 殿后
   .to("#hud-tag, #ed-title, #ed-badges", { autoAlpha: 0, y: -40, duration: 0.4, ease: "power2.in", stagger: 0.05 }, 4.6)
   .to("#scrim", { autoAlpha: 0, duration: 0.45, ease: "power1.in" }, 4.75);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
