<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #sh-scrim {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(5, 8, 14, 0.85) 0%, rgba(5, 8, 14, 0.6) 40%, transparent 68%);
  }
  .corner-tag {
    position: absolute; top: 56px; left: 72px;
    background: rgba(8, 10, 16, 0.8); border-radius: 12px;
    padding: 14px 22px 12px; border: 1px solid rgba(255, 255, 255, 0.12);
  }
  .corner-tag .row1 { display: flex; align-items: center; gap: 12px; }
  .corner-tag .bar { width: 5px; height: 26px; background: #46d390; }
  .corner-tag .en { font-size: 23px; font-weight: 800; letter-spacing: 6px; color: #46d390; text-shadow: 0 0 12px rgba(70,211,144,.6); }
  .corner-tag .cn { color: #c8cad3; font-size: 21px; font-weight: 700; margin-top: 8px; letter-spacing: 2px; }
  #sh-hero { position: absolute; top: 200px; left: 110px; }
  #sh-hero .num {
    color: #46d390; font-size: 210px; font-weight: 900; line-height: 1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 0 50px rgba(70, 211, 144, 0.55), 0 0 110px rgba(70, 211, 144, 0.3);
    will-change: transform;
  }
  #sh-hero .cap { color: #fff; font-size: 34px; font-weight: 800; margin-top: 16px; letter-spacing: 2px; text-shadow: 0 2px 12px rgba(0,0,0,.7); }
  #sh-hero .cap em { color: #46d390; font-style: normal; font-weight: 900; }


</style>
</head>
<body>
<div id="stage">
<div id="sh-scrim"></div>
<div class="corner-tag" id="sh-tag">
  <div class="row1"><div class="bar"></div><span class="en">【DATA TAG · 中文】</span></div>
  <div class="cn">【数据来源说明】</div>
</div>
<div id="sh-hero">
  <div class="num" id="sh-num">【×1】</div>
  <div class="cap">【说明行 · <em>强调词</em>】</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  const b = gsap.timeline({ defaults: { ease: "power3.out" } });
  b.from("#sh-scrim", { autoAlpha: 0, duration: 0.5, ease: "power1.out" }, 0)
   .from("#sh-tag", { x: -60, autoAlpha: 0, duration: 0.45 }, 0.1)
   .from("#sh-num", { scale: 0.2, autoAlpha: 0, rotation: -8, duration: 0.7, ease: "elastic.out(1, 0.5)" }, 0.5)
   .from("#sh-hero .cap", { y: 40, autoAlpha: 0, duration: 0.45 }, 1.1)
   .to("#sh-num", { scale: 1.05, duration: 0.3, ease: "power1.inOut", repeat: 3, yoyo: true }, 1.9)
   .to("#sh-tag, #sh-hero", { autoAlpha: 0, y: -50, duration: 0.4, ease: "power2.in" }, 3.4)
   .to("#sh-scrim", { autoAlpha: 0, duration: 0.4, ease: "power1.in" }, 3.55);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
