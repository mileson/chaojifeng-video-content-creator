<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #dcm-stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
    transform-origin: 50% 50%;
    will-change: transform, filter;
  }

  .dcm-filter-defs {
    position: absolute;
    width: 0;
    height: 0;
    overflow: hidden;
  }


</style>
</head>
<body>
<div id="stage">
<svg class="dcm-filter-defs" aria-hidden="true" focusable="false">
  <filter id="dcm-horizontal-blur" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur id="dcm-horizontal-blur-node" in="SourceGraphic" stdDeviation="0 0" />
  </filter>
</svg>
<div id="dcm-stage" data-layout-allow-overflow></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  (function () {
    function cubicBezierEase(x1, y1, x2, y2) {
      function value(t) {
        var mt = 1 - t;
        return {
          x: 3 * x1 * mt * mt * t + 3 * x2 * mt * t * t + t * t * t,
          y: 3 * y1 * mt * mt * t + 3 * y2 * mt * t * t + t * t * t,
        };
      }

      return function (p) {
        var lo = 0;
        var hi = 1;
        for (var i = 0; i < 14; i++) {
          var mid = (lo + hi) / 2;
          if (value(mid).x > p) hi = mid;
          else lo = mid;
        }
        return value((lo + hi) / 2).y;
      };
    }

    var easeOut = cubicBezierEase(0.21, 0.93, 0.48, 0.97);
    var easeBack = cubicBezierEase(0.73, 0.02, 0.86, 0.1);

    function resolveTarget(target) {
      if (target instanceof Element) return target;
      return document.querySelector(target || "#dcm-stage");
    }

    function setBlur(el, amount) {
      var node = document.getElementById("dcm-horizontal-blur-node");
      if (!node) return;
      if (amount > 0.15) {
        node.setAttribute("stdDeviation", amount.toFixed(2) + " 0.35");
        el.style.filter = "url(#dcm-horizontal-blur)";
      } else {
        node.setAttribute("stdDeviation", "0 0");
        el.style.filter = "";
      }
    }

    window.driftCameraAt = function (t, opts) {
      opts = opts || {};
      var el = resolveTarget(opts.target);
      if (!el) return null;

      var dur = opts.duration || 3.5;
      var startX = opts.startX !== undefined ? opts.startX : -120;
      var midX = opts.midX !== undefined ? opts.midX : 60;
      var rotation = opts.rotation !== undefined ? opts.rotation : 3;
      var scale = opts.scale || 1.2;
      var blurMax = opts.blurMax !== undefined ? opts.blurMax : 7.5;
      var blurState = { v: blurMax };
      var local = gsap.timeline();

      local.set(el, {
        x: startX,
        y: 0,
        rotation: rotation,
        scale: scale,
        transformOrigin: opts.origin || "50% 50%",
        force3D: true,
      }, 0);
      local.to(el, { x: midX, duration: dur * 0.5, ease: easeOut }, 0);
      local.to(el, { x: startX, duration: dur * 0.5, ease: easeBack }, dur * 0.5);
      local.to(el, { rotation: -rotation, duration: dur, ease: "none" }, 0);
      local.to(blurState, {
        v: 0,
        duration: dur * 0.5,
        ease: easeOut,
        onStart: function () { setBlur(el, blurMax); },
        onUpdate: function () { setBlur(el, blurState.v); },
        onComplete: function () { setBlur(el, 0); },
      }, 0);

      if (opts.reset !== false) {
        local.set(el, { x: 0, y: 0, rotation: 0, scale: 1, clearProps: "filter" }, dur + 0.02);
      }

      tl.add(local, t);
      return local;
    };
  })();

  // 演示节奏：一次完整漂移运镜
  driftCameraAt(t0, { duration: 3.5 });


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
