<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #efz-stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: #000;
    transform-origin: 50% 50%;
  }

  .efz-motion {
    position: absolute;
    inset: 0;
    will-change: transform, filter;
  }


</style>
</head>
<body>
<div id="stage">
<div id="efz-stage" data-layout-allow-overflow></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  (function () {
    function cubicBezierEase(x1, y1, x2, y2) {
      function value(t) {
        var mt = 1 - t;
        return {
          x: 3 * x1 * mt * mt * t + 3 * x2 * mt * t * t + t * t * t,
          y: 3 * y1 * mt * mt * t + 3 * y2 * mt * t * t + t * t * t,
        };
      }
      return function (p) {
        p = Math.max(0, Math.min(1, p));
        var lo = 0;
        var hi = 1;
        for (var i = 0; i < 14; i++) {
          var mid = (lo + hi) / 2;
          if (value(mid).x > p) hi = mid;
          else lo = mid;
        }
        return value((lo + hi) / 2).y;
      };
    }

    function springDropEase(p) {
      p = Math.max(0, Math.min(1, p));
      if (p === 0 || p === 1) return p;
      var q = p / 2;
      return Math.pow(2, -10 * q) * Math.sin((q - 0.4 / 4) * (2 * Math.PI) / 0.4) + 1;
    }

    var easeSnap = cubicBezierEase(0.215, 0.61, 0.355, 1);
    var easeLift = cubicBezierEase(0.25, 0.46, 0.45, 0.94);
    var easeSettle = cubicBezierEase(0.55, 0.055, 0.675, 0.19);

    function resolveTarget(target) {
      if (target instanceof Element) return target;
      return document.querySelector(target || "#efz-stage");
    }

    function prepareMotionLayer(root) {
      if (!root) return null;
      if (root.classList && root.classList.contains("efz-motion")) return root;
      var existing = root.querySelector(":scope > .efz-motion");
      if (existing) return existing;
      var layer = document.createElement("div");
      layer.className = "efz-motion";
      while (root.firstChild) layer.appendChild(root.firstChild);
      root.appendChild(layer);
      return layer;
    }

    window.elasticFocusAt = function (t, opts) {
      opts = opts || {};
      var container = resolveTarget(opts.target);
      var el = prepareMotionLayer(container);
      if (!el) return null;

      var dur = opts.duration || 1.0;
      var startY = opts.y !== undefined ? opts.y : "10%";
      var blurMax = opts.blurMax !== undefined ? opts.blurMax : 4;
      var local = gsap.timeline();

      local.set(el, {
        transformOrigin: opts.origin || "50% 50%",
        x: 0,
        y: startY,
        scale: opts.startScale || 1.5,
        rotation: opts.startRotation !== undefined ? opts.startRotation : 5,
        filter: "blur(" + blurMax + "px)",
        force3D: true,
      }, 0);

      local.to(el, {
        y: 0,
        scale: 1,
        rotation: 0,
        duration: dur * 0.20,
        ease: springDropEase,
      }, 0);

      local.to(el, {
        scale: opts.overshootScale || 1.3,
        rotation: opts.overshootRotation !== undefined ? opts.overshootRotation : -5,
        duration: dur * 0.30,
        ease: easeLift,
      }, dur * 0.20);

      local.to(el, {
        scale: opts.endScale || 0.8,
        rotation: opts.endRotation || 0,
        duration: dur * 0.50,
        ease: easeSettle,
      }, dur * 0.50);

      local.to(el, {
        filter: "blur(" + Math.max(0.8, blurMax * 0.35).toFixed(2) + "px)",
        duration: dur * 0.60,
        ease: easeSnap,
      }, 0);

      local.to(el, {
        filter: "blur(0px)",
        duration: dur * 0.40,
        ease: easeSettle,
      }, dur * 0.60);

      if (opts.restore !== false) {
        local.set(el, { x: 0, y: 0, scale: 1, rotation: 0, clearProps: "filter" }, dur + 0.02);
      }

      tl.add(local, t);
      return local;
    };

    window.elasticStretchTransitionAt = window.elasticFocusAt;
  })();

  // 演示节奏：一秒内完成伸缩转场
  requestAnimationFrame(function () {
    elasticFocusAt(t0, { duration: 1.0 });
  });


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
