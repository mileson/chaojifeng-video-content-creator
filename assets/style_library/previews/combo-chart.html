<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #cc-card { position: absolute; left: 50%; top: 50%; width: 1080px; height: 660px;
    background: rgba(13,15,22,.95); border: 1px solid rgba(255,255,255,.13); border-radius: 22px; padding: 40px 52px;
    box-shadow: 0 36px 100px rgba(0,0,0,.6); }
  #cc-title { color: #fff; font-size: 30px; font-weight: 900; }
  #cc-title em { color: #3e9eff; font-style: normal; }
  #cc-sub { color: #8b8d98; font-size: 16px; font-weight: 600; margin-top: 6px; }
  #cc-plot { position: relative; height: 420px; margin-top: 40px; border-bottom: 2px solid rgba(255,255,255,.18);
    display: flex; align-items: flex-end; justify-content: space-around; padding: 0 30px; }
  .cc-bcol { width: 110px; display: flex; flex-direction: column; align-items: center; }
  .cc-bar { width: 78px; border-radius: 8px 8px 0 0; background: linear-gradient(180deg, #3e9eff, #1d4f8c); transform-origin: bottom; }
  .cc-bv { color: #fff; font-size: 22px; font-weight: 800; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
  .cc-bl { position: absolute; bottom: -38px; color: #8b8d98; font-size: 16px; font-weight: 700; }
  #cc-svg { position: absolute; inset: 0; overflow: visible; }


</style>
</head>
<body>
<div id="stage">
<div id="cc-card">
  <div id="cc-title">【图表标题】 · <em>【强调副题】</em></div>
  <div id="cc-sub">【单位说明 · 折线含义】</div>
  <div id="cc-plot">
    <div class="cc-bcol"><div class="cc-bv" id="cc-v1">0</div><div class="cc-bar" id="cc-b1" style="height:330px"></div><div class="cc-bl">【项1】</div></div>
    <div class="cc-bcol"><div class="cc-bv" id="cc-v2">0</div><div class="cc-bar" id="cc-b2" style="height:210px"></div><div class="cc-bl">【项2】</div></div>
    <div class="cc-bcol"><div class="cc-bv" id="cc-v3">0</div><div class="cc-bar" id="cc-b3" style="height:96px"></div><div class="cc-bl">【项3】</div></div>
    <div class="cc-bcol"><div class="cc-bv" id="cc-v4">0</div><div class="cc-bar" id="cc-b4" style="height:34px;background:linear-gradient(180deg,#46d390,#1d7a4f)"></div><div class="cc-bl">【强调项】</div></div>
    <svg id="cc-svg" viewBox="0 0 976 420">
      <path id="cc-line" d="M 110,300 L 355,250 L 600,160 L 845,60" fill="none" stroke="#ffb224" stroke-width="5" stroke-linecap="round" stroke-dasharray="8 10" />
      <circle class="cc-dot" cx="110" cy="300" r="9" fill="#ffb224"/><circle class="cc-dot" cx="355" cy="250" r="9" fill="#ffb224"/>
      <circle class="cc-dot" cx="600" cy="160" r="9" fill="#ffb224"/><circle class="cc-dot" cx="845" cy="60" r="9" fill="#ffb224"/>
    </svg>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  const b = gsap.timeline();
  gsap.set("#cc-card", { xPercent: -50, yPercent: -50 });
  b.from("#cc-card", { autoAlpha: 0, y: 60, scale: 0.96, duration: 0.55, ease: "power3.out" }, 0);
  b.from(["#cc-b1", "#cc-b2", "#cc-b3", "#cc-b4"], { scaleY: 0, duration: 0.6, ease: "power2.out", stagger: 0.14 }, 0.5);
  [["#cc-v1", 2.4], ["#cc-v2", 1.5], ["#cc-v3", 0.7], ["#cc-v4", 0.2]].forEach((cfg, i) => {
    const st = { v: 0 };
    b.to(st, {
      v: cfg[1], duration: 0.8, ease: "power1.out",
      onUpdate() { document.querySelector(cfg[0]).textContent = "¥" + st.v.toFixed(1); },
    }, 0.55 + i * 0.14);
  });
  const line = document.getElementById("cc-line");
  const len = line.getTotalLength();
  b.set(line, { attr: { "stroke-dasharray": len, "stroke-dashoffset": len } }, 0);
  b.to(line, { attr: { "stroke-dashoffset": 0 }, duration: 1.0, ease: "power2.inOut" }, 1.4);
  b.from(".cc-dot", { scale: 0, transformOrigin: "center", duration: 0.3, ease: "back.out(2.5)", stagger: 0.2 }, 1.5);
  b.to("#cc-card", { autoAlpha: 0, y: -30, duration: 0.45, ease: "power2.in" }, 4.9);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
