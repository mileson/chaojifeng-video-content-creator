<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #tlv-card {
    position: absolute; top: 130px; left: 110px;
    width: 760px;
    background: rgba(16, 18, 26, 0.9);
    border: 1.5px solid rgba(255, 255, 255, 0.14);
    border-radius: 22px; padding: 34px 44px 38px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    will-change: transform;
  }
  #tlv-card h3 { color: #3e9eff; font-size: 26px; font-weight: 800; letter-spacing: 5px; margin-bottom: 26px; text-shadow: 0 0 14px rgba(62,158,255,.5); }
  #tlv-line {
    position: absolute; left: 57px; top: 110px; width: 4px; height: 372px;
    background: linear-gradient(180deg, #3e9eff, #46d390, #ffb224, #46d390);
    border-radius: 2px;
    box-shadow: 0 0 16px rgba(62, 158, 255, 0.5);
    transform-origin: top center;
  }
  #tlv-card .item { display: flex; align-items: center; gap: 22px; margin-bottom: 28px; position: relative; }
  #tlv-card .item:last-child { margin-bottom: 0; }
  #tlv-card .dot { width: 22px; height: 22px; border-radius: 50%; flex-shrink: 0; border: 4px solid rgba(10, 12, 18, 0.9); }
  #tlv-card .item.i1 .dot { background: #3e9eff; box-shadow: 0 0 14px rgba(62,158,255,.8); }
  #tlv-card .item.i2 .dot { background: #46d390; box-shadow: 0 0 14px rgba(70,211,144,.8); }
  #tlv-card .item.i3 .dot { background: #ffb224; box-shadow: 0 0 14px rgba(255,178,36,.8); }
  #tlv-card .item.i4 .dot { background: #46d390; box-shadow: 0 0 18px rgba(70,211,144,1); }
  #tlv-card .item .date { width: 150px; flex-shrink: 0; font-size: 24px; font-weight: 800; letter-spacing: 2px; color: #8b8d98; font-variant-numeric: tabular-nums; }
  #tlv-card .item .txt { color: #e8e8ec; font-size: 30px; font-weight: 700; }
  #tlv-card .item.i4 .txt { color: #46d390; font-size: 36px; font-weight: 900; text-shadow: 0 0 16px rgba(70,211,144,.55); }


</style>
</head>
<body>
<div id="stage">
<div id="tlv-card" data-layout-allow-overflow>
  <h3>【ENGLISH LABEL · 中文标题】</h3>
  <div id="tlv-line" data-layout-ignore></div>
  <div class="item i1"><div class="dot"></div><span class="date">【步骤一】</span><span class="txt">【内容一】</span></div>
  <div class="item i2"><div class="dot"></div><span class="date">【步骤二】</span><span class="txt">【内容二】</span></div>
  <div class="item i3"><div class="dot"></div><span class="date">【步骤三】</span><span class="txt">【内容三】</span></div>
  <div class="item i4"><div class="dot"></div><span class="date">【结论】</span><span class="txt">【结论内容（强调）】</span></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  const b = gsap.timeline({ defaults: { ease: "power3.out" } });
  b.from("#tlv-card", { y: 80, autoAlpha: 0, duration: 0.55 }, 0.15)
   .from("#tlv-line", { scaleY: 0, duration: 1.6, ease: "power2.inOut" }, 0.6)
   .from("#tlv-card .item", { x: -50, autoAlpha: 0, duration: 0.45, stagger: 0.35 }, 0.7)
   .to("#tlv-card .item.i4 .txt", { scale: 1.08, transformOrigin: "left center", duration: 0.28, ease: "power1.inOut", repeat: 3, yoyo: true }, 2.6)
   .to("#tlv-card", { y: 70, autoAlpha: 0, duration: 0.4, ease: "power2.in" }, 5.05);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
