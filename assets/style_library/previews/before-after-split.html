<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #bas-wrap { position: absolute; inset: 0; }
  #bas-left { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; background: #14161d; overflow: hidden; }
  #bas-right { position: absolute; right: 0; top: 0; bottom: 0; width: 50%; background: linear-gradient(160deg, #11324a, #0d4a52); overflow: hidden; }
  #bas-divider { position: absolute; left: 50%; top: 0; bottom: 0; width: 5px; margin-left: -2px;
    background: linear-gradient(180deg, #4dd0e1, #ff7a59); box-shadow: 0 0 24px rgba(77,208,225,.7); }
  .bas-label { position: absolute; top: 110px; left: 0; right: 0; text-align: center; font-size: 26px; font-weight: 900; letter-spacing: 4px; }
  #bas-left .bas-label { color: #8b93a3; }
  #bas-right .bas-label { color: #4dd0e1; }
  .bas-big { position: absolute; top: 42%; left: 0; right: 0; text-align: center; font-size: 60px; font-weight: 900; }
  #bas-left .bas-big { color: #aab2c2; }
  #bas-right .bas-big { color: #fff; text-shadow: 0 0 36px rgba(77,208,225,.5); }
  .bas-sub { position: absolute; top: 56%; left: 0; right: 0; text-align: center; font-size: 23px; font-weight: 700; }
  #bas-left .bas-sub { color: #69718a; }
  #bas-right .bas-sub { color: #bfeef5; }
  #bas-strike { position: absolute; top: 47.5%; left: 20%; width: 60%; height: 5px; background: #ff5c5c; transform-origin: left; border-radius: 3px; }


</style>
</head>
<body>
<div id="stage">
<div id="bas-wrap">
  <div id="bas-left">
    <div class="bas-label">BEFORE · 【旧方式】</div>
    <div class="bas-big">【痛点大字】</div>
    <div id="bas-strike"></div>
    <div class="bas-sub">【痛点细节】</div>
  </div>
  <div id="bas-right">
    <div class="bas-label">AFTER · 【新方式】</div>
    <div class="bas-big">【收益大字】</div>
    <div class="bas-sub">【收益细节】</div>
  </div>
  <div id="bas-divider"></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  tl.from("#bas-left", { xPercent: -100, duration: 0.55, ease: "power3.out" }, t0);
  tl.from("#bas-right", { xPercent: 100, duration: 0.55, ease: "power3.out" }, t0 + 0.15);
  tl.from("#bas-divider", { scaleY: 0, transformOrigin: "top", duration: 0.5, ease: "power2.inOut" }, t0 + 0.55);
  tl.from("#bas-left .bas-label", { autoAlpha: 0, y: -16, duration: 0.4 }, t0 + 0.8);
  tl.from("#bas-right .bas-label", { autoAlpha: 0, y: -16, duration: 0.4 }, t0 + 0.95);
  tl.from("#bas-left .bas-big", { autoAlpha: 0, y: 26, duration: 0.45 }, t0 + 1.1);
  tl.fromTo("#bas-strike", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.inOut" }, t0 + 1.7);
  tl.from("#bas-right .bas-big", { autoAlpha: 0, scale: 1.4, duration: 0.45, ease: "power4.out" }, t0 + 2.1);
  tl.from(["#bas-left .bas-sub", "#bas-right .bas-sub"], { autoAlpha: 0, y: 16, duration: 0.4, stagger: 0.12 }, t0 + 2.5);
  tl.to("#bas-right .bas-big", { textShadow: "0 0 60px rgba(77,208,225,.9)", duration: 0.4, yoyo: true, repeat: 1 }, t0 + 3.2);
  tl.to("#bas-wrap", { autoAlpha: 0, duration: 0.5, ease: "power2.in" }, t0 + 4.9);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
