<!--
模式：一键安装打勾流（install-progress-checklist）【容器层 · 产品演示】
适用场景：「一键安装 / 全自动配置」卖点演示，进度条 + 逐项打勾 + 百分比 count-up。
框架参数：
  - 步骤行数（3~5 条）：文案 + 耗时标注；标题（em 高亮「全自动」）
  - 进度时长（默认 2.8s 推满）
技术要点：
  - 进度条 scaleX 0→1（transform-origin: left）+ 百分比 state 对象同步 count-up（同 ease 同 duration）
  - 打勾节奏：每 0.7s 一项，check 圆 backgroundColor+borderColor 变绿 + scale 1.18 back.out(2.5) 回弹
  - tabular-nums 保证数字宽度稳定；卡片居中 gsap.set xPercent/yPercent -50
-->
<style>
  #ipc-card { position: absolute; left: 50%; top: 50%; width: 880px; background: rgba(13,17,26,.95);
    border: 1px solid rgba(255,255,255,.13); border-radius: 20px; padding: 40px 48px;
    box-shadow: 0 36px 90px rgba(0,0,0,.6); }
  #ipc-title { color: #fff; font-size: 28px; font-weight: 900; display: flex; align-items: center; gap: 14px; }
  #ipc-title em { color: #4dd0e1; font-style: normal; }
  #ipc-barbox { height: 14px; border-radius: 99px; background: rgba(255,255,255,.1); margin-top: 26px; overflow: hidden; }
  #ipc-fill { height: 100%; width: 100%; border-radius: 99px; transform-origin: left;
    background: linear-gradient(90deg, #2b7fd4, #4dd0e1); box-shadow: 0 0 18px rgba(77,208,225,.7); }
  #ipc-pct { color: #4dd0e1; font-size: 20px; font-weight: 900; margin-top: 10px; text-align: right; font-variant-numeric: tabular-nums; }
  .ipc-row { display: flex; align-items: center; gap: 16px; margin-top: 20px; }
  .ipc-check { width: 38px; height: 38px; border-radius: 50%; background: rgba(255,255,255,.08);
    border: 2px solid rgba(255,255,255,.2); display: flex; align-items: center; justify-content: center;
    color: #06241a; font-size: 20px; font-weight: 900; }
  .ipc-t { color: #cfd5e3; font-size: 23px; font-weight: 700; }
  .ipc-time { margin-left: auto; color: #69718a; font-size: 17px; font-weight: 700; font-variant-numeric: tabular-nums; }
</style>

<div id="ipc-card">
  <div id="ipc-title">⚡ 【一键安装 · 】<em>【全自动】</em></div>
  <div id="ipc-barbox"><div id="ipc-fill"></div></div>
  <div id="ipc-pct">0%</div>
  <div class="ipc-row"><div class="ipc-check" id="ipc-k1">✓</div><div class="ipc-t">【步骤1】</div><div class="ipc-time">【0.8s】</div></div>
  <div class="ipc-row"><div class="ipc-check" id="ipc-k2">✓</div><div class="ipc-t">【步骤2】</div><div class="ipc-time">【42s】</div></div>
  <div class="ipc-row"><div class="ipc-check" id="ipc-k3">✓</div><div class="ipc-t">【步骤3】</div><div class="ipc-time">【3.2s】</div></div>
  <div class="ipc-row"><div class="ipc-check" id="ipc-k4">✓</div><div class="ipc-t">【步骤4】</div><div class="ipc-time">完成 ✓</div></div>
</div>

<script>
  gsap.set("#ipc-card", { xPercent: -50, yPercent: -50 });
  tl.from("#ipc-card", { autoAlpha: 0, y: 60, scale: 0.95, duration: 0.55 }, t0);
  var st = { p: 0 }, pct = null;
  tl.set("#ipc-fill", { scaleX: 0 }, t0);
  tl.to("#ipc-fill", { scaleX: 1, duration: 2.8, ease: "power1.inOut" }, t0 + 0.5);
  tl.to(st, { p: 100, duration: 2.8, ease: "power1.inOut",
    onUpdate: function () { pct = pct || document.getElementById("ipc-pct"); pct.textContent = Math.floor(st.p) + "%"; } }, t0 + 0.5);
  ["#ipc-k1", "#ipc-k2", "#ipc-k3", "#ipc-k4"].forEach(function (sel, i) {
    tl.to(sel, { backgroundColor: "#46d390", borderColor: "#46d390", color: "#06241a",
      scale: 1.18, duration: 0.22, ease: "back.out(2.5)" }, t0 + 0.9 + i * 0.7);
    tl.to(sel, { scale: 1, duration: 0.2 }, t0 + 1.14 + i * 0.7);
  });
  tl.to("#ipc-card", { autoAlpha: 0, y: -30, duration: 0.45, ease: "power2.in" }, t0 + 4.9);
</script>
