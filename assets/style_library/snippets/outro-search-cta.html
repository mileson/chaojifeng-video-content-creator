<!--
模式：搜索引导片尾（outro-search-cta）【片尾层 · 拼接式结尾】
适用场景：产品相关视频收尾 5~7s——大搜索框逐字打出产品名 + 搜索按钮按下，
  「想试就去搜」的合规弱引导（无链接/无站外码，只演示搜索动作）。
⚠️ 合规铁律：框内只打产品名/作品名，不打网址；按钮只写「搜索」。
框架参数：
  - 搜索词（产品名）、提示语、候选下拉 2 条（增强真实感）
技术要点：
  - 搜索框光标闪烁 + 逐字打字（steps 节奏）；候选下拉随打字浮现
  - 打完 0.5s 搜索按钮按压（scale 0.94 → 回弹）+ 框体光晕脉冲
  - 底部小字「各大应用商店 / 搜索引擎都能搜到」兜底合规表达
-->
<style>
  #osc-bg { position: absolute; inset: 0;
    background: radial-gradient(130% 100% at 50% 0%, #14233a 0%, #0a121f 58%, #060b13 100%); }
  #osc-hint { position: absolute; left: 50%; top: 280px; transform: translateX(-50%);
    color: #9aa6ba; font-size: 30px; font-weight: 700; }
  #osc-hint b { color: #3e9eff; }
  #osc-box { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%);
    width: 1040px; height: 110px; border-radius: 99px; display: flex; align-items: center;
    background: rgba(255,255,255,.07); border: 2px solid rgba(62,158,255,.5);
    box-shadow: 0 24px 80px rgba(0,0,0,.45); padding: 0 22px 0 44px; }
  #osc-glass { font-size: 40px; margin-right: 24px; opacity: .8; }
  #osc-text { color: #f4f7ff; font-size: 42px; font-weight: 800; letter-spacing: 2px; white-space: nowrap; }
  #osc-caret { display: inline-block; width: 4px; height: 46px; background: #3e9eff;
    vertical-align: -6px; margin-left: 6px; }
  #osc-btn { margin-left: auto; color: #fff; font-size: 28px; font-weight: 900; letter-spacing: 6px;
    background: linear-gradient(135deg, #3e9eff, #2477d4); border-radius: 99px; padding: 16px 44px; }
  #osc-drop { position: absolute; left: 50%; top: calc(44% + 80px); transform: translateX(-50%);
    width: 1000px; border-radius: 20px; overflow: hidden;
    background: rgba(14,20,32,.96); border: 1px solid rgba(255,255,255,.1); }
  .osc-item { display: flex; align-items: center; gap: 16px; padding: 20px 36px;
    color: #c4cede; font-size: 26px; font-weight: 700; }
  .osc-item + .osc-item { border-top: 1px solid rgba(255,255,255,.06); }
  .osc-item span { opacity: .55; font-size: 22px; }
  #osc-foot { position: absolute; left: 50%; bottom: 110px; transform: translateX(-50%);
    color: #76819a; font-size: 22px; font-weight: 600; letter-spacing: 2px; }
</style>

<div id="osc-bg" data-layout-allow-overflow></div>
<div id="osc-hint">想自己试试？打开任何应用商店，<b>搜这个名字</b></div>
<div id="osc-box">
  <div id="osc-glass">🔍</div>
  <div id="osc-text"><span id="osc-typed"></span><span id="osc-caret" data-layout-ignore></span></div>
  <div id="osc-btn">搜索</div>
</div>
<div id="osc-drop">
  <div class="osc-item">🔍 【产品名】<span>· 【榜单名】</span></div>
  <div class="osc-item">🔍 【产品名】 【功能词】<span>· 热门搜索</span></div>
</div>
<div id="osc-foot">应用商店 · 搜索引擎 · 都能搜到</div>

<script>
  (function () {
    var WORD = "【产品名】";
    tl.from("#osc-bg", { autoAlpha: 0, duration: 0.6 }, t0);
    tl.from("#osc-hint", { autoAlpha: 0, y: -22, duration: 0.5 }, t0 + 0.35);
    tl.from("#osc-box", { autoAlpha: 0, scale: 0.92, duration: 0.55, ease: "back.out(1.5)" }, t0 + 0.6);
    // 光标常闪
    tl.to("#osc-caret", { opacity: 0, duration: 0.45, yoyo: true, repeat: 11, ease: "steps(1)" }, t0 + 0.8);
    // 逐字打出
    var typed = document.getElementById("osc-typed");
    for (var i = 0; i < WORD.length; i++) {
      (function (n) {
        tl.add(function () { typed.textContent = WORD.slice(0, n + 1); }, t0 + 1.4 + n * 0.28);
      })(i);
    }
    tl.from("#osc-drop", { autoAlpha: 0, y: -16, duration: 0.45 }, t0 + 2.1);
    // 按搜索
    tl.to("#osc-btn", { scale: 0.94, duration: 0.1, ease: "power2.in" }, t0 + 3.2);
    tl.to("#osc-btn", { scale: 1, duration: 0.3, ease: "back.out(3)" }, t0 + 3.3);
    tl.to("#osc-box", { boxShadow: "0 24px 100px rgba(62,158,255,.45)", duration: 0.5,
      yoyo: true, repeat: 1 }, t0 + 3.3);
    tl.from("#osc-foot", { autoAlpha: 0, duration: 0.5 }, t0 + 3.8);
  })();
</script>
