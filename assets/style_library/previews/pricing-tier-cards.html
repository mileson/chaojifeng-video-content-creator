<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #ptc-row { position: absolute; top: 50%; left: 50%; display: flex; gap: 36px;
    transform: translate(-50%, -50%); }
  .ptc-card {
    width: 380px; border-radius: 24px; padding: 38px 34px 40px; position: relative;
    background: rgba(15, 18, 27, 0.95); border: 1.5px solid rgba(255, 255, 255, 0.13);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55); will-change: transform;
  }
  .ptc-card h4 { color: #9aa3b8; font-size: 26px; font-weight: 800; letter-spacing: 3px; }
  .ptc-price { margin-top: 18px; color: #fff; font-size: 76px; font-weight: 900;
    font-variant-numeric: tabular-nums; letter-spacing: -1px; }
  .ptc-price small { font-size: 26px; color: #8b93a6; font-weight: 600; margin-left: 6px; }
  .ptc-feats { margin-top: 26px; display: flex; flex-direction: column; gap: 14px; }
  .ptc-feat { display: flex; gap: 12px; color: #c4cbd9; font-size: 24px; will-change: transform; }
  .ptc-feat i { color: #46d390; font-weight: 900; font-style: normal; }
  .ptc-card.hot { border: 2px solid transparent;
    background: linear-gradient(rgba(17, 21, 34, 0.97), rgba(17, 21, 34, 0.97)) padding-box,
      linear-gradient(135deg, #46d390, #3e9eff) border-box; }
  .ptc-card.hot .ptc-price { color: #46d390; text-shadow: 0 0 26px rgba(70, 211, 144, 0.45); }
  .ptc-ribbon { position: absolute; top: -18px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(135deg, #46d390, #3e9eff); color: #07101e;
    font-size: 21px; font-weight: 900; letter-spacing: 2px;
    border-radius: 999px; padding: 9px 24px; box-shadow: 0 10px 26px rgba(70, 211, 144, 0.4);
    will-change: transform; }


</style>
</head>
<body>
<div id="stage">
<div id="ptc-row">
  <div class="ptc-card">
    <h4>【免费版】</h4>
    <div class="ptc-price">¥0</div>
    <div class="ptc-feats">
      <div class="ptc-feat"><i>✓</i>【基础权益 1】</div>
      <div class="ptc-feat"><i>✓</i>【基础权益 2】</div>
      <div class="ptc-feat"><i>✓</i>【基础权益 3】</div>
    </div>
  </div>
  <div class="ptc-card hot">
    <div class="ptc-ribbon">最划算</div>
    <h4>【专业版】</h4>
    <div class="ptc-price">¥【价】<small>/月</small></div>
    <div class="ptc-feats">
      <div class="ptc-feat"><i>✓</i>【核心权益 1】</div>
      <div class="ptc-feat"><i>✓</i>【核心权益 2】</div>
      <div class="ptc-feat"><i>✓</i>【核心权益 3】</div>
    </div>
  </div>
  <div class="ptc-card">
    <h4>【买断版】</h4>
    <div class="ptc-price">¥【价】<small>一次</small></div>
    <div class="ptc-feats">
      <div class="ptc-feat"><i>✓</i>【权益 1】</div>
      <div class="ptc-feat"><i>✓</i>【权益 2】</div>
      <div class="ptc-feat"><i>✓</i>【权益 3】</div>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  const b = gsap.timeline({ defaults: { ease: "power3.out" } });
  b.from(".ptc-card", { y: 120, autoAlpha: 0, duration: 0.6, ease: "back.out(1.4)", stagger: 0.14 }, 0.2)
    .from(".ptc-ribbon", { scale: 0, autoAlpha: 0, duration: 0.45, ease: "back.out(2.2)" }, 0.9)
    .to(".ptc-card.hot", { scale: 1.06, duration: 0.45, ease: "back.out(1.6)" }, 1.05)
    .fromTo(".ptc-card.hot", { boxShadow: "0 30px 80px rgba(0,0,0,.55), 0 0 0 rgba(70,211,144,0)" },
      { boxShadow: "0 30px 80px rgba(0,0,0,.55), 0 0 70px rgba(70,211,144,.35)", duration: 0.5, yoyo: true, repeat: 1 }, 1.15)
    .from(".ptc-card.hot .ptc-feat", { x: -22, autoAlpha: 0, duration: 0.35, stagger: 0.1 }, 1.2)
    .to("#ptc-row", { y: 80, autoAlpha: 0, duration: 0.5, ease: "power2.in" }, 6.8);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
