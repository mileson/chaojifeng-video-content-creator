<!--
  模式：证据摘录侧条 + 规则编号清单 ⚙️
  适用：右侧竖向长条卡（主题色描边）放大可读的截图列表 + y 滚动到关键条 + 高亮条 scaleX 扫亮；左侧规则编号块（语义色 1 红 2 蓝 + 结论行 + 深色底板）逐条弹入。左结论右证据。
  参数化：描边色/高亮条位置/规则条数配色。截图宽设为容器 1.3~1.5 倍实现放大裁切，文字必须可读。

  通用规则：
  - 所有左侧 HUD/清单/标签类必须自带深色底板 rgba(8,10,16,.8) + 圆角 + 细描边——
    亮色录屏上裸白字会直接消失
  - 大型 PIP/全屏容器（窗口/手机/bento 背景/glow 层）加 data-layout-ignore，beat 容器加 data-layout-allow-overflow
  - 内容滚动用「停顿式分段 y 平移」（power1.inOut 多段）比匀速滚动更像真人浏览
-->
<style>
  /* ===== B6 excerpt-strip 摘录侧条 + 规则清单 ===== */
  #b6-strip { position: absolute; top: 64px; right: 64px; width: 560px; height: 830px; border-radius: 22px;
    background: #fff; border: 3px solid #e5484d; box-shadow: 0 0 36px rgba(229,72,77,.35), 0 36px 90px rgba(0,0,0,.55); overflow: hidden; }
  #b6-inner { position: absolute; top: 0; left: 0; width: 800px; }
  #b6-inner .blk { padding: 24px 20px 10px; }
  #b6-inner img { width: 760px; border-radius: 10px; display: block; margin-bottom: 20px; }
  #b6-hl { position: absolute; left: 26px; top: 96px; width: 470px; height: 52px; background: rgba(62,99,221,.3);
    border-radius: 8px; transform-origin: left center; }
  #b6-rules { position: absolute; left: 56px; top: 220px; display: flex; flex-direction: column; gap: 44px; background: rgba(8,10,16,.8); border: 1px solid rgba(255,255,255,.14); border-radius: 20px; padding: 30px 34px; }
  .b6-rule .rk { font-size: 13px; font-weight: 800; letter-spacing: 3px; margin-bottom: 8px; }
  .b6-rule .row { display: flex; align-items: center; gap: 16px; }
  .b6-rnum { width: 52px; height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 900; color: #fff; }
  .b6-rule .tx { color: #fff; font-size: 27px; font-weight: 800; }
  .b6-rule .tx em { font-style: normal; }
  #b6-r1 .rk { color: #ff8589; } #b6-r1 .b6-rnum { background: #e5484d; box-shadow: 0 0 22px rgba(229,72,77,.5); } #b6-r1 .tx em { color: #ff8589; }
  #b6-r2 .rk { color: #7ab8ff; } #b6-r2 .b6-rnum { background: #3e63dd; box-shadow: 0 0 22px rgba(62,99,221,.5); } #b6-r2 .tx em { color: #7ab8ff; }
</style>

<!-- B6 摘录侧条 + 规则清单 -->
  <div id="b6" class="clip beat" data-start="32" data-duration="5.5" data-track-index="0" data-layout-allow-overflow>
    <div id="b6-rules">
      <div class="b6-rule" id="b6-r1">
        <div class="rk">RULE 01 · 别用错入口</div>
        <div class="row"><div class="b6-rnum">1</div><div class="tx">订阅制 ≠ API，<em>贵 10 倍</em></div></div>
      </div>
      <div class="b6-rule" id="b6-r2">
        <div class="rk">RULE 02 · 缓存是关键</div>
        <div class="row"><div class="b6-rnum">2</div><div class="tx">命中缓存，成本砍到 <em>1/10</em></div></div>
      </div>
    </div>
    <div id="b6-strip">
      <div id="b6-inner">
        <div class="blk">
          <img src="assets/praise_infoq.jpg" />
          <img src="assets/praise_appso.jpg" />
          <img src="assets/praise_jiqizhixin.jpg" />
        </div>
      </div>
      <div id="b6-hl"></div>
    </div>
  </div>

<script>
  // tl 为主 timeline（paused + window.__timelines 注册），t0 为节拍起点秒，挂载时按工程调整
  /* ===== B6 摘录侧条 + 规则清单（32 起） ===== */
  (function () {
    var t0 = 32;
    tl.from("#b6-strip", { autoAlpha: 0, x: 90, duration: 0.6 }, t0);
    tl.from("#b6-r1", { autoAlpha: 0, x: -30, duration: 0.5, ease: "back.out(1.7)" }, t0 + 0.5);
    tl.to("#b6-inner", { y: -120, duration: 1.2, ease: "power1.inOut" }, t0 + 1.2);
    tl.fromTo("#b6-hl", { scaleX: 0 }, { scaleX: 1, autoAlpha: 1, duration: 0.5, ease: "power2.inOut" }, t0 + 2.5);
    tl.from("#b6-r2", { autoAlpha: 0, x: -30, duration: 0.5, ease: "back.out(1.7)" }, t0 + 2.9);
    tl.to("#b6", { autoAlpha: 0, duration: 0.45, ease: "power2.in" }, t0 + 4.9);
  })();
</script>
