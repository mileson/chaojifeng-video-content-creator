<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #pct-row { position: absolute; left: 50%; top: 50%; display: flex; gap: 30px; }
  .pct-card { width: 400px; background: rgba(13,17,26,.95); border: 1px solid rgba(255,255,255,.12);
    border-radius: 20px; padding: 36px 34px; box-shadow: 0 30px 80px rgba(0,0,0,.55); }
  .pct-ico { width: 80px; height: 80px; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 40px; }
  .pct-q { color: #8b93a3; font-size: 17px; font-weight: 800; letter-spacing: 3px; margin-top: 22px; }
  .pct-name { color: #fff; font-size: 34px; font-weight: 900; margin-top: 8px; }
  .pct-pain { color: #9aa3b5; font-size: 19px; line-height: 1.55; margin-top: 14px; }
  .pct-pain em { color: #ffa48c; font-style: normal; font-weight: 800; }
  #pct-p1 .pct-ico { background: rgba(77,208,225,.16); border: 1.5px solid rgba(77,208,225,.6); }
  #pct-p2 .pct-ico { background: rgba(255,122,89,.14); border: 1.5px solid rgba(255,122,89,.6); }
  #pct-p3 .pct-ico { background: rgba(139,92,246,.16); border: 1.5px solid rgba(139,92,246,.6); }
  #pct-p1 { border-top: 3px solid #4dd0e1; } #pct-p2 { border-top: 3px solid #ff7a59; } #pct-p3 { border-top: 3px solid #8b5cf6; }


</style>
</head>
<body>
<div id="stage">
<div id="pct-row">
  <div class="pct-card" id="pct-p1">
    <div class="pct-ico">【emoji】</div>
    <div class="pct-q">如果你是</div>
    <div class="pct-name">【人群1】</div>
    <div class="pct-pain">【痛点描述，<em>关键痛点高亮</em>】</div>
  </div>
  <div class="pct-card" id="pct-p2">
    <div class="pct-ico">【emoji】</div>
    <div class="pct-q">如果你是</div>
    <div class="pct-name">【人群2】</div>
    <div class="pct-pain">【痛点描述，<em>关键痛点高亮</em>】</div>
  </div>
  <div class="pct-card" id="pct-p3">
    <div class="pct-ico">【emoji】</div>
    <div class="pct-q">如果你是</div>
    <div class="pct-name">【人群3】</div>
    <div class="pct-pain">【痛点描述，<em>关键痛点高亮</em>】</div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  gsap.set("#pct-row", { xPercent: -50, yPercent: -50 });
  tl.from(".pct-card", { autoAlpha: 0, y: 70, rotation: function (i) { return [-2, 1.5, -1][i]; },
    duration: 0.55, ease: "back.out(1.5)", stagger: 0.22 }, t0);
  [0, 1, 2].forEach(function (i) {
    var sel = ["#pct-p1", "#pct-p2", "#pct-p3"][i];
    tl.to(".pct-card", { opacity: 0.45, scale: 0.97, duration: 0.3 }, t0 + 1.4 + i * 0.9);
    tl.to(sel, { opacity: 1, scale: 1.04, duration: 0.3, ease: "back.out(2)" }, t0 + 1.4 + i * 0.9);
  });
  tl.to(".pct-card", { opacity: 1, scale: 1, duration: 0.3 }, t0 + 4.1);
  tl.to("#pct-row", { autoAlpha: 0, y: -30, duration: 0.45, ease: "power2.in" }, t0 + 4.5);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
