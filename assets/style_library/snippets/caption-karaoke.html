<!--
模式：逐词卡拉OK高亮字幕（karaoke caption）【节拍层 · 口播强调】
适用场景：一句核心论断随口播逐词点亮（"这个方法 直接把成本 打到 两毛钱"），
  借鉴 Hyperframes 官方 caption-highlight：红底块逐词 scaleX 扫入。（Apache-2.0，署名见 THIRD_PARTY_NOTICES.md）
框架参数：
  - words 数组：{ t 文案, at 点亮时刻, hold 维持时长 }——按真实口播时间戳填
  - 高亮色（默认红 #ff1745）、是否保留最后一个词常亮（关键词收尾）
技术要点：
  - 每词一个 .kr-w，内部 .kr-bg 红底 scaleX 0→1（transform-origin: left）扫入
  - 点亮同时词 scale 1.06 yoyo 弹一下（有"重音"感）
  - 上一个词在下一个词点亮时熄灭（除最后一个）
  - 整行必须有深色底板 + white-space: nowrap（防换行，铁律）
  - 行容器 left:50% + gsap.set xPercent:-50 居中（不要写 CSS transform）
-->
<style>
  #kr-row { position: absolute; left: 50%; bottom: 300px; display: flex; gap: 14px;
    background: rgba(8,10,16,.78); border: 1px solid rgba(255,255,255,.12); border-radius: 20px;
    padding: 14px 36px; box-shadow: 0 20px 50px rgba(0,0,0,.45); white-space: nowrap; }
  .kr-w { position: relative; color: #fff; font-size: 64px; font-weight: 900; padding: 8px 16px 10px;
    text-shadow: 0 6px 18px rgba(0,0,0,.55); white-space: nowrap; }
  .kr-bg { position: absolute; inset: 0; border-radius: 12px; background: linear-gradient(135deg, #ff1745, #df1238);
    box-shadow: 0 12px 30px rgba(229,20,58,.35); z-index: -1; transform: scaleX(0); transform-origin: left center; opacity: 0; }
</style>

<!-- beat 容器需加 data-layout-allow-overflow -->
<div id="kr-row"></div>

<script>
  const b = gsap.timeline();
  gsap.set("#kr-row", { xPercent: -50 });
  const words = [
    { t: "【词1】", at: 0.3, hold: 0.55 },
    { t: "【词2】", at: 0.95, hold: 0.6 },
    { t: "【关键词】", at: 1.65, hold: 1.6 },
  ];
  const row = document.getElementById("kr-row");
  words.forEach((w, i) => {
    const el = document.createElement("div");
    el.className = "kr-w"; el.id = "kr-w" + i;
    el.innerHTML = '<span class="kr-bg" id="kr-bg' + i + '"></span>' + w.t;
    row.appendChild(el);
  });
  b.from("#kr-row", { autoAlpha: 0, y: 26, duration: 0.4, ease: "power3.out" }, 0);
  words.forEach((w, i) => {
    b.to("#kr-bg" + i, { opacity: 1, scaleX: 1, duration: 0.18, ease: "power2.out" }, w.at);
    b.to("#kr-w" + i, { scale: 1.06, duration: 0.12, yoyo: true, repeat: 1, ease: "power2.inOut" }, w.at);
    if (i < words.length - 1) b.to("#kr-bg" + i, { opacity: 0, duration: 0.14, ease: "power2.in" }, w.at + w.hold);
  });
  b.to("#kr-row", { autoAlpha: 0, y: -18, duration: 0.4, ease: "power2.in" }, 4.4);
</script>
