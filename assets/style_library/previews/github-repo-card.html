<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #grc-card { position: absolute; left: 50%; top: 50%; width: 760px;
    border-radius: 18px; background: #0d1117; border: 1px solid #30363d;
    box-shadow: 0 0 0 6px rgba(88,166,255,.08), 0 0 50px rgba(88,166,255,.18), 0 40px 90px rgba(0,0,0,.6);
    padding: 34px 38px; }
  #grc-head { display: flex; align-items: center; gap: 14px; }
  #grc-avatar { width: 40px; height: 40px; border-radius: 50%; flex: none;
    background: linear-gradient(135deg, #58a6ff, #bc8cff); }
  #grc-name { color: #58a6ff; font-size: 30px; font-weight: 800;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  #grc-name .owner { color: #8b949e; font-weight: 600; }
  #grc-badge { margin-left: 6px; padding: 4px 12px; border-radius: 999px; flex: none;
    border: 1px solid #30363d; color: #8b949e; font-size: 15px; font-weight: 700; }
  #grc-desc { margin-top: 18px; color: #c9d1d9; font-size: 20px; line-height: 1.6; font-weight: 500; }
  #grc-meta { margin-top: 24px; display: flex; align-items: center; gap: 28px;
    color: #8b949e; font-size: 17px; font-weight: 600; }
  .grc-m { display: flex; align-items: center; gap: 8px; }
  #grc-lang-dot { width: 13px; height: 13px; border-radius: 50%; background: #3572a5; }
  #grc-star-n { color: #e3b341; font-weight: 800; }
  #grc-cta { margin-top: 26px; padding: 13px 0; border-radius: 10px; text-align: center;
    background: #238636; color: #fff; font-size: 19px; font-weight: 800; letter-spacing: 1px; }


</style>
</head>
<body>
<div id="stage">
<div id="grc" class="clip beat" data-start="0.4" data-duration="5.0" data-track-index="0" data-layout-ignore>
  <div id="grc-card">
    <div id="grc-head">
      <div id="grc-avatar"></div>
      <div id="grc-name"><span class="owner">your-name /</span> 【repo-name】</div>
      <div id="grc-badge">Public</div>
    </div>
    <div id="grc-desc">【一句话描述：这个仓库解决什么问题，20~40 字】</div>
    <div id="grc-meta">
      <div class="grc-m"><div id="grc-lang-dot"></div>【Python】</div>
      <div class="grc-m">★ <span id="grc-star-n">0</span></div>
      <div class="grc-m">⑂ 【12】 forks</div>
      <div class="grc-m">⊙ 【1】 Branch · 【0】 Tags</div>
    </div>
    <div id="grc-cta">⭐ Star 一下 · 完全免费</div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  /* ===== GitHub 仓库卡（0.4 起，star count-up）===== */
  (function () {
    var t0 = 0.4;
    gsap.set("#grc-card", { xPercent: -50, yPercent: -50 });
    tl.from("#grc-card", { autoAlpha: 0, y: 60, scale: 0.94, duration: 0.6, ease: "power3.out" }, t0);
    tl.from("#grc-head", { autoAlpha: 0, x: -22, duration: 0.45 }, t0 + 0.25);
    tl.from("#grc-desc", { autoAlpha: 0, y: 14, duration: 0.45 }, t0 + 0.5);
    tl.from("#grc-meta .grc-m", { autoAlpha: 0, y: 12, duration: 0.4, stagger: 0.12 }, t0 + 0.75);
    countUp("#grc-star-n", 1284, 1.1, t0 + 0.95);
    tl.from("#grc-cta", { autoAlpha: 0, scale: 0.85, duration: 0.5, ease: "back.out(1.8)" }, t0 + 1.5);
    tl.to("#grc-cta", { boxShadow: "0 0 26px rgba(35,134,54,.8)", duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, t0 + 2.1);
    tl.to("#grc-card", { autoAlpha: 0, y: 40, duration: 0.45, ease: "power2.in" }, t0 + 4.4);
  })();


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
