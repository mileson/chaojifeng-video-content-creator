<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  /* ===== B6 excerpt-strip 摘录侧条 + 规则清单 ===== */
  #b6-strip { position: absolute; top: 64px; right: 64px; width: 560px; height: 830px; border-radius: 22px;
    background: #fff; border: 3px solid #e5484d; box-shadow: 0 0 36px rgba(229,72,77,.35), 0 36px 90px rgba(0,0,0,.55); overflow: hidden; }
  #b6-inner { position: absolute; top: 0; left: 0; width: 800px; }
  #b6-inner .blk { padding: 24px 20px 10px; }
  #b6-inner img { width: 760px; border-radius: 10px; display: block; margin-bottom: 20px; }
  #b6-hl { position: absolute; left: 26px; top: 96px; width: 470px; height: 52px; background: rgba(62,99,221,.3);
    border-radius: 8px; transform-origin: left center; }
  #b6-rules { position: absolute; left: 56px; top: 220px; display: flex; flex-direction: column; gap: 44px; background: rgba(8,10,16,.8); border: 1px solid rgba(255,255,255,.14); border-radius: 20px; padding: 30px 34px; }
  .b6-rule .rk { font-size: 13px; font-weight: 800; letter-spacing: 3px; margin-bottom: 8px; }
  .b6-rule .row { display: flex; align-items: center; gap: 16px; }
  .b6-rnum { width: 52px; height: 52px; border-radius: 12px; display: flex; align-items: center; justify-content: center;
    font-size: 28px; font-weight: 900; color: #fff; }
  .b6-rule .tx { color: #fff; font-size: 27px; font-weight: 800; }
  .b6-rule .tx em { font-style: normal; }
  #b6-r1 .rk { color: #ff8589; } #b6-r1 .b6-rnum { background: #e5484d; box-shadow: 0 0 22px rgba(229,72,77,.5); } #b6-r1 .tx em { color: #ff8589; }
  #b6-r2 .rk { color: #7ab8ff; } #b6-r2 .b6-rnum { background: #3e63dd; box-shadow: 0 0 22px rgba(62,99,221,.5); } #b6-r2 .tx em { color: #7ab8ff; }


</style>
</head>
<body>
<div id="stage">
<div id="b6" class="clip beat" data-start="32" data-duration="5.5" data-track-index="0" data-layout-allow-overflow>
    <div id="b6-rules">
      <div class="b6-rule" id="b6-r1">
        <div class="rk">RULE 01 · 别用错入口</div>
        <div class="row"><div class="b6-rnum">1</div><div class="tx">订阅制 ≠ API，<em>贵 10 倍</em></div></div>
      </div>
      <div class="b6-rule" id="b6-r2">
        <div class="rk">RULE 02 · 缓存是关键</div>
        <div class="row"><div class="b6-rnum">2</div><div class="tx">命中缓存，成本砍到 <em>1/10</em></div></div>
      </div>
    </div>
    <div id="b6-strip">
      <div id="b6-inner">
        <div class="blk">
          <img src="assets/praise_infoq.jpg" />
          <img src="assets/praise_appso.jpg" />
          <img src="assets/praise_jiqizhixin.jpg" />
        </div>
      </div>
      <div id="b6-hl"></div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  // tl 为主 timeline（paused + window.__timelines 注册），t0 为节拍起点秒，挂载时按工程调整
  /* ===== B6 摘录侧条 + 规则清单（32 起） ===== */
  (function () {
    var t0 = 0.4;
    tl.from("#b6-strip", { autoAlpha: 0, x: 90, duration: 0.6 }, t0);
    tl.from("#b6-r1", { autoAlpha: 0, x: -30, duration: 0.5, ease: "back.out(1.7)" }, t0 + 0.5);
    tl.to("#b6-inner", { y: -120, duration: 1.2, ease: "power1.inOut" }, t0 + 1.2);
    tl.fromTo("#b6-hl", { scaleX: 0 }, { scaleX: 1, autoAlpha: 1, duration: 0.5, ease: "power2.inOut" }, t0 + 2.5);
    tl.from("#b6-r2", { autoAlpha: 0, x: -30, duration: 0.5, ease: "back.out(1.7)" }, t0 + 2.9);
    tl.to("#b6", { autoAlpha: 0, duration: 0.45, ease: "power2.in" }, t0 + 4.9);
  })();


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
