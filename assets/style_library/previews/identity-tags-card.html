<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  /* ===== B9 identity-tags-card ===== */
  #b9-wrap { position: absolute; top: 70px; left: 56px; background: rgba(8,10,16,.8); border: 1px solid rgba(255,255,255,.14); border-radius: 20px; box-shadow: 0 24px 60px rgba(0,0,0,.45); padding: 26px 32px; }
  #b9-title { color: #fff; font-size: 52px; font-weight: 900; }
  #b9-title em { color: #3e9eff; font-style: normal; }
  #b9-grid { margin-top: 34px; display: grid; grid-template-columns: repeat(2, 330px); gap: 22px 28px; }
  .b9-tag { display: flex; align-items: center; gap: 14px; }
  .b9-ico { width: 48px; height: 48px; border-radius: 12px; background: rgba(62,158,255,.15); border: 1px solid rgba(62,158,255,.5);
    display: flex; align-items: center; justify-content: center; font-size: 24px; }
  .b9-tag .zh { color: #fff; font-size: 23px; font-weight: 800; }
  .b9-tag .en { color: #8b8d98; font-size: 12px; font-weight: 700; letter-spacing: 2px; margin-top: 2px; }


</style>
</head>
<body>
<div id="stage">
<div id="b9" class="clip beat" data-start="50.5" data-duration="5" data-track-index="0" data-layout-allow-overflow>
    <div id="b9-wrap">
      <div id="b9-title">【开场短语】 <em>【强调短语】</em></div>
      <div id="b9-grid">
        <div class="b9-tag" id="b9-t1"><div class="b9-ico">🧪</div><div><div class="zh">【身份标签一】</div><div class="en">TAG ONE</div></div></div>
        <div class="b9-tag" id="b9-t2"><div class="b9-ico">💸</div><div><div class="zh">【身份标签二】</div><div class="en">TAG TWO</div></div></div>
        <div class="b9-tag" id="b9-t3"><div class="b9-ico">🛠️</div><div><div class="zh">【身份标签三】</div><div class="en">TAG THREE</div></div></div>
        <div class="b9-tag" id="b9-t4"><div class="b9-ico">🚀</div><div><div class="zh">【身份标签四】</div><div class="en">TAG FOUR</div></div></div>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  // tl 为主 timeline（paused + window.__timelines 注册），t0 为节拍起点秒，挂载时按工程调整
  /* ===== B9 身份名片清单卡（50.5 起） ===== */
  (function () {
    var t0 = 0.4;
    tl.from("#b9-title", { autoAlpha: 0, y: 24, duration: 0.55 }, t0);
    tl.to("#b9-title em", { color: "#7ab8ff", textShadow: "0 0 24px rgba(62,158,255,.8)", duration: 0.4, yoyo: true, repeat: 1 }, t0 + 0.7);
    tl.from(".b9-tag", { autoAlpha: 0, x: -26, scale: 0.9, duration: 0.5, ease: "back.out(1.6)",
      stagger: { each: 0.18, grid: [2, 2], from: "start" } }, t0 + 0.9);
    tl.to("#b9-wrap", { autoAlpha: 0, duration: 0.5, ease: "power2.in" }, t0 + 4.4);
  })();


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
