<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #ch-scrim {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(5, 8, 14, 0.9) 0%, rgba(5, 8, 14, 0.74) 38%, rgba(5, 8, 14, 0.3) 60%, transparent 78%);
  }
  #ch-step { position: absolute; top: 120px; left: 80px; display: flex; align-items: center; gap: 16px; }
  #ch-step .pill { background: #ffb224; color: #1a1a1a; border-radius: 8px; font-size: 25px; font-weight: 900; letter-spacing: 4px; padding: 7px 18px; }
  #ch-step .note { color: #c8cad3; font-size: 23px; font-weight: 700; letter-spacing: 2px; }
  #ch-title { position: absolute; top: 210px; left: 80px; }
  #ch-title .big { color: #fff; font-size: 118px; font-weight: 900; line-height: 1.04; text-shadow: 0 6px 30px rgba(0,0,0,.55); }
  #ch-title .sub { color: #ffb224; font-size: 36px; font-weight: 800; margin-top: 16px; letter-spacing: 4px; text-shadow: 0 0 16px rgba(255,178,36,.5); }
  #ch-tag {
    position: absolute; top: 520px; left: 80px;
    border: 2px solid #46d390; border-radius: 12px;
    color: #46d390; font-size: 26px; font-weight: 800; letter-spacing: 3px;
    padding: 12px 24px; background: rgba(13, 35, 24, 0.55);
    text-shadow: 0 0 12px rgba(70, 211, 144, 0.6);
    will-change: transform;
  }


</style>
</head>
<body>
<div id="stage">
<div id="ch-scrim"></div>
<div id="ch-step"><span class="pill">【STEP · 02 / 03】</span><span class="note">【章节副注释】</span></div>
<div id="ch-title">
  <div class="big">【大标题.】</div>
  <div class="sub">【副标题说明】</div>
</div>
<div id="ch-tag">【+ 关键词 → 卖点 · 卖点】</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  // 需 gsap.registerPlugin(SplitText)
  const b = gsap.timeline({ defaults: { ease: "power3.out" } });
  const split = SplitText.create("#ch-title .big", { type: "chars" });
  b.from("#ch-scrim", { autoAlpha: 0, duration: 0.5, ease: "power1.out" }, 0)
   .from("#ch-step", { x: -60, autoAlpha: 0, duration: 0.45 }, 0.1)
   .from(split.chars, { y: 100, autoAlpha: 0, duration: 0.55, ease: "power4.out", stagger: { each: 0.055, from: "start" } }, 0.35)
   .from("#ch-title .sub", { x: -50, autoAlpha: 0, duration: 0.45 }, "<0.4")
   .from("#ch-tag", { scale: 0.6, autoAlpha: 0, duration: 0.5, ease: "back.out(1.8)" }, 1.5)
   .to("#ch-tag", { scale: 1.04, duration: 0.3, ease: "power1.inOut", repeat: 3, yoyo: true }, 2.1)
   .to("#ch-step, #ch-title, #ch-tag", { autoAlpha: 0, y: -40, duration: 0.4, ease: "power2.in", stagger: 0.05 }, 3.6)
   .to("#ch-scrim", { autoAlpha: 0, duration: 0.45, ease: "power1.in" }, 3.75);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
