<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #ssf-wall { position: absolute; inset: 0; background: linear-gradient(160deg, #0d1117 0%, #1a2233 60%, #14202e 100%); }
  #ssf-frame { position: absolute; left: 50%; top: 50%; width: 1480px; height: 850px; border-radius: 18px;
    background: #f4f6f9; overflow: hidden; box-shadow: 0 60px 140px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.1); }
  #ssf-bar { height: 52px; background: #e8ebf0; display: flex; align-items: center; padding: 0 20px; gap: 9px; }
  .ssf-dot { width: 14px; height: 14px; border-radius: 50%; }
  #ssf-url { margin-left: 20px; background: #fff; border-radius: 8px; color: #555; font-size: 16px; padding: 8px 22px; font-weight: 600; }
  #ssf-content { position: relative; height: calc(100% - 52px); padding: 36px 48px; }
  .ssf-row { height: 52px; border-radius: 10px; background: rgba(16,24,40,.08); margin-bottom: 18px; }
  #ssf-hero { height: 150px; border-radius: 14px; background: linear-gradient(135deg, rgba(77,208,225,.25), rgba(43,127,212,.18));
    border: 1px solid rgba(43,127,212,.3); margin-bottom: 18px; display: flex; align-items: center; padding: 0 34px;
    color: #1a4a66; font-size: 30px; font-weight: 900; }
  #ssf-cap { position: absolute; left: 90px; bottom: 60px; background: rgba(10,14,22,.88); color: #fff;
    border: 1px solid rgba(255,255,255,.16); border-radius: 12px; padding: 12px 26px; font-size: 21px; font-weight: 900; }
  #ssf-cap em { color: #4dd0e1; font-style: normal; }


</style>
</head>
<body>
<div id="stage">
<div id="ssf-wall" data-layout-ignore></div>
<div id="ssf-frame">
  <div id="ssf-bar">
    <div class="ssf-dot" style="background:#ff5f57"></div><div class="ssf-dot" style="background:#febc2e"></div><div class="ssf-dot" style="background:#28c840"></div>
    <div id="ssf-url">【app.example.com / dashboard】</div>
  </div>
  <div id="ssf-content">
    <div id="ssf-hero">【核心操作区文案】</div>
    <div class="ssf-row" style="width:88%"></div>
    <div class="ssf-row" style="width:74%"></div>
    <div class="ssf-row" style="width:81%"></div>
  </div>
</div>
<div id="ssf-cap"><span>【说明前缀 · 】</span><em>【高亮结论】</em></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  gsap.set("#ssf-frame", { xPercent: -50, yPercent: -50 });
  tl.from("#ssf-wall", { autoAlpha: 0, duration: 0.4 }, t0);
  tl.from("#ssf-frame", { autoAlpha: 0, y: 70, scale: 0.93, duration: 0.6 }, t0 + 0.25);
  tl.from("#ssf-cap", { autoAlpha: 0, x: -40, duration: 0.45 }, t0 + 0.7);
  // 自动变焦推近（Screen Studio 工艺核心）
  tl.to("#ssf-frame", { scale: 1.45, y: 170, duration: 0.9, ease: "power2.inOut" }, t0 + 1.8);
  tl.to("#ssf-frame", { scale: 1, y: 0, duration: 0.8, ease: "power2.inOut" }, t0 + 3.9);
  tl.to(["#ssf-frame", "#ssf-cap", "#ssf-wall"], { autoAlpha: 0, duration: 0.45, ease: "power2.in" }, t0 + 5.4);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
