<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #oct-bg { position: absolute; inset: 0;
    background: radial-gradient(130% 100% at 50% 0%, #1c1a2e 0%, #0e0c1a 58%, #080710 100%); }
  #oct-kicker { position: absolute; left: 50%; top: 200px; transform: translateX(-50%);
    color: #ffb224; font-size: 26px; font-weight: 800; letter-spacing: 10px; }
  #oct-ringbox { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%); }
  #oct-num { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    color: #f4f7ff; font-size: 200px; font-weight: 900; }
  #oct-flash { position: absolute; inset: 0; background: #fff; opacity: 0; }
  #oct-egg { position: absolute; left: 50%; top: 46%; transform: translate(-50%, -50%);
    text-align: center; opacity: 0; }
  #oct-egg-title { color: #ffb224; font-size: 25px; font-weight: 800; letter-spacing: 8px;
    text-shadow: 0 0 26px rgba(255,178,36,.5); }
  #oct-egg-text { color: #f4f7ff; font-size: 46px; font-weight: 900; margin-top: 22px; white-space: nowrap;
    text-shadow: 0 2px 16px rgba(0,0,0,.6), 0 0 56px rgba(255,178,36,.22); }


</style>
</head>
<body>
<div id="stage">
<div id="oct-bg" data-layout-allow-overflow></div>
<div id="oct-kicker">看到最后的人 · 有彩蛋</div>
<div id="oct-ringbox" data-layout-allow-overflow>
  <svg width="420" height="420" viewBox="0 0 420 420">
    <circle cx="210" cy="210" r="186" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10"/>
    <circle id="oct-ring" cx="210" cy="210" r="186" fill="none" stroke="#ffb224" stroke-width="10"
      stroke-linecap="round" transform="rotate(-90 210 210)"/>
  </svg>
  <div id="oct-num">3</div>
</div>
<div id="oct-egg">
  <div id="oct-egg-title">EASTER EGG</div>
  <div id="oct-egg-text">这期视频的 B-Roll，全是 AI 自己写代码渲染的</div>
</div>
<div id="oct-flash" data-layout-ignore></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  (function () {
    var C = 2 * Math.PI * 186;
    gsap.set("#oct-ring", { strokeDasharray: C, strokeDashoffset: 0 });
    tl.from("#oct-bg", { autoAlpha: 0, duration: 0.5 }, t0);
    tl.from("#oct-kicker", { autoAlpha: 0, y: -20, duration: 0.45 }, t0 + 0.3);
    tl.from("#oct-ringbox", { autoAlpha: 0, scale: 0.8, duration: 0.5, ease: "back.out(1.6)" }, t0 + 0.5);
    tl.to("#oct-ring", { strokeDashoffset: C, duration: 3, ease: "none" }, t0 + 1.0);
    var num = document.getElementById("oct-num");
    tl.add(function () { num.textContent = "3"; }, t0); // 循环播放/重播时数字复位
    [2, 1].forEach(function (n, i) {
      var at = t0 + 2.0 + i * 1.0;
      tl.to("#oct-num", { rotationX: 90, duration: 0.18, ease: "power2.in" }, at - 0.18);
      tl.add(function () { num.textContent = String(n); }, at);
      tl.fromTo("#oct-num", { rotationX: -90 }, { rotationX: 0, duration: 0.22, ease: "back.out(2)" }, at);
      tl.fromTo("#oct-ringbox", { scale: 1.05 }, { scale: 1, duration: 0.3 }, at);
    });
    // 归零：白闪 + 彩蛋弹出
    var z = t0 + 4.0;
    tl.fromTo("#oct-flash", { opacity: 0 }, { opacity: 1, duration: 0.06 }, z);
    tl.to("#oct-flash", { opacity: 0, duration: 0.3 }, z + 0.06);
    tl.set(["#oct-ringbox", "#oct-kicker"], { autoAlpha: 0 }, z);
    tl.fromTo("#oct-egg", { autoAlpha: 0, scale: 0.7 },
      { autoAlpha: 1, scale: 1, duration: 0.8, ease: "elastic.out(1, 0.5)" }, z + 0.1);
  })();


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
