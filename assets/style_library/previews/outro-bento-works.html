<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #obw-bg { position: absolute; inset: 0;
    background: radial-gradient(130% 100% at 50% 0%, #18243a 0%, #0b111e 58%, #070b14 100%); }
  #obw-head { position: absolute; left: 50%; top: 86px; transform: translateX(-50%); text-align: center; }
  #obw-kicker { color: #ffb224; font-size: 22px; font-weight: 800; letter-spacing: 7px; }
  #obw-title { color: #f4f7ff; font-size: 50px; font-weight: 900; margin-top: 8px; }
  #obw-grid { position: absolute; left: 50%; top: 250px; transform: translateX(-50%);
    display: grid; grid-template-columns: repeat(4, 360px); grid-auto-rows: 280px; gap: 24px; }
  .obw-cell { border-radius: 24px; padding: 28px; position: relative; overflow: hidden;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.12); }
  #obw-hero { grid-column: 1 / span 2; grid-row: 1 / span 2;
    border: 2px solid rgba(255,178,36,.55); box-shadow: 0 0 70px rgba(255,178,36,.14);
    display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
  .obw-icon { display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 900;
    border: 1px solid rgba(255,255,255,.22); }
  #obw-hero .obw-icon { width: 150px; height: 150px; border-radius: 32px; font-size: 76px;
    background: linear-gradient(145deg, #ffb224, #ffb22499); box-shadow: 0 18px 50px rgba(0,0,0,.5); }
  #obw-hero-name { color: #f4f7ff; font-size: 44px; font-weight: 900; margin-top: 26px; }
  #obw-hero-desc { color: #a8b3c8; font-size: 24px; font-weight: 700; margin-top: 12px; }
  #obw-hero-badge { display: inline-block; margin-top: 18px; font-size: 18px; font-weight: 800;
    color: #ffd58a; background: rgba(255,178,36,.14); border: 1px solid rgba(255,178,36,.45);
    border-radius: 99px; padding: 6px 20px; letter-spacing: 2px; }
  .obw-mini { display: flex; flex-direction: column; justify-content: center; gap: 12px; }
  .obw-mini .obw-icon { width: 68px; height: 68px; border-radius: 16px; font-size: 34px; }
  .obw-c1 { background: linear-gradient(145deg, #3e9eff, #3e9eff99); }
  .obw-c2 { background: linear-gradient(145deg, #46d390, #46d39099); }
  .obw-c3 { background: linear-gradient(145deg, #a878ff, #a878ff99); }
  .obw-mini-name { color: #e7edf8; font-size: 25px; font-weight: 900; }
  .obw-mini-desc { color: #8d99af; font-size: 17px; font-weight: 600; }
  #obw-more { display: flex; align-items: center; justify-content: center;
    color: #76819a; font-size: 24px; font-weight: 800; letter-spacing: 3px; }


</style>
</head>
<body>
<div id="stage">
<div id="obw-bg" data-layout-allow-overflow></div>
<div id="obw-head">
  <div id="obw-kicker">WORKS</div>
  <div id="obw-title">【创作者名称】的作品们</div>
</div>
<div id="obw-grid">
  <div class="obw-cell" id="obw-hero">
    <div class="obw-icon">A</div>
    <div id="obw-hero-name">【主推作品】</div>
    <div id="obw-hero-desc">【一句话介绍】· 最新发布</div>
    <div id="obw-hero-badge">NEW · 客户端</div>
  </div>
  <div class="obw-cell obw-mini"><div class="obw-icon obw-c1">B</div>
    <div class="obw-mini-name">【作品 B】</div><div class="obw-mini-desc">【一句话介绍】</div></div>
  <div class="obw-cell obw-mini"><div class="obw-icon obw-c2">C</div>
    <div class="obw-mini-name">【作品 C】</div><div class="obw-mini-desc">【一句话介绍】</div></div>
  <div class="obw-cell obw-mini"><div class="obw-icon obw-c3">D</div>
    <div class="obw-mini-name">【作品 D】</div><div class="obw-mini-desc">【一句话介绍】</div></div>
  <div class="obw-cell" id="obw-more">还有 N 款 · 主页都有</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  tl.from("#obw-bg", { autoAlpha: 0, duration: 0.6 }, t0);
  tl.from(["#obw-kicker", "#obw-title"], { autoAlpha: 0, y: 22, duration: 0.5, stagger: 0.12 }, t0 + 0.35);
  tl.from("#obw-hero", { autoAlpha: 0, scale: 0.82, duration: 0.6, ease: "back.out(1.5)" }, t0 + 0.8);
  tl.from("#obw-hero .obw-icon", { scale: 0.4, rotation: -10, duration: 0.55, ease: "back.out(2)" }, t0 + 1.0);
  tl.from([".obw-mini", "#obw-more"], { autoAlpha: 0, y: 44, scale: 0.92, duration: 0.5,
    ease: "back.out(1.5)", stagger: 0.14 }, t0 + 1.3);
  tl.to("#obw-hero", { boxShadow: "0 0 100px rgba(255,178,36,.3)", duration: 1.1,
    yoyo: true, repeat: 3, ease: "sine.inOut" }, t0 + 2.2);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
