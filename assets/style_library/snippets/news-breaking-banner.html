<!--
模式：突发资讯横幅（科技资讯/评论开场）
适用场景：资讯评论类视频开场抛事件：「就在今天，XX 发布了 XX」。新闻直播间质感。
结构要点：
  - 下三分之一横幅：左侧红色 BREAKING 块 + 右侧标题区（主标题 + 副标题滚动条）
  - 顶部细红线 + 时间戳角标；底部 ticker 条用 nowrap 横向滚动（可选）
  - 红色只用在 BREAKING 块与细节，避免整屏红造成廉价感
动画要点：
  - 红块 scaleX 0→1 先铺开 → BREAKING 字符弹入 + 红块闪两下（强提醒）
  - 主标题从遮罩内上滑揭示（overflow hidden 经典新闻条手法）
  - ticker 条匀速左移（linear），时间戳淡入
参数：BREAKING 文案/主标题/ticker 内容/时间戳
-->
<style>
  #nbb-wrap { position: absolute; left: 0; right: 0; bottom: 150px; }
  #nbb-line { height: 4px; background: linear-gradient(90deg, #ff3b30, rgba(255, 59, 48, 0.15));
    transform-origin: 0 50%; }
  #nbb-main { display: flex; align-items: stretch; background: rgba(10, 12, 18, 0.94);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
  #nbb-brk { flex: none; display: flex; align-items: center; padding: 0 38px;
    background: #d92b20; color: #fff; font-size: 40px; font-weight: 900; letter-spacing: 5px;
    transform-origin: 0 50%; will-change: transform; }
  #nbb-title-clip { overflow: hidden; padding: 26px 40px; }
  #nbb-title { color: #fff; font-size: 50px; font-weight: 900; letter-spacing: 2px; will-change: transform; }
  #nbb-title em { color: #ffb224; font-style: normal; }
  #nbb-sub { display: flex; align-items: center; gap: 24px; background: rgba(255, 255, 255, 0.06);
    padding: 12px 40px; overflow: hidden; }
  #nbb-time { flex: none; color: #ff6e64; font-size: 24px; font-weight: 800;
    font-variant-numeric: tabular-nums; }
  #nbb-ticker { white-space: nowrap; color: #aab2c2; font-size: 24px; will-change: transform; }
</style>

<div id="nbb-wrap">
  <div id="nbb-line"></div>
  <div id="nbb-main">
    <div id="nbb-brk">突发</div>
    <div id="nbb-title-clip"><div id="nbb-title">【主标题：今天发生了什么 · 关键对象用 <em>强调色</em>】</div></div>
  </div>
  <div id="nbb-sub">
    <div id="nbb-time">【12:31】</div>
    <div id="nbb-ticker">【ticker 滚动条：补充信息 · 数据点 · 相关方回应 · 持续更新中】</div>
  </div>
</div>

<script>
  const b = gsap.timeline({ defaults: { ease: "power3.out" } });
  b.from("#nbb-wrap", { y: 110, autoAlpha: 0, duration: 0.5 }, 0.15)
    .from("#nbb-line", { scaleX: 0, duration: 0.5, ease: "power2.inOut" }, 0.25)
    .from("#nbb-brk", { scaleX: 0, duration: 0.4, ease: "power3.inOut" }, 0.45)
    .fromTo("#nbb-brk", { filter: "brightness(1.9)" }, { filter: "brightness(1)", duration: 0.16, repeat: 3, yoyo: true }, 0.9)
    .from("#nbb-title", { yPercent: 110, duration: 0.55, ease: "power4.out" }, 0.85)
    .from("#nbb-sub", { autoAlpha: 0, duration: 0.4 }, 1.3)
    .fromTo("#nbb-ticker", { x: 0 }, { x: -420, duration: 6, ease: "none" }, 1.5)
    .to("#nbb-wrap", { y: 110, autoAlpha: 0, duration: 0.5, ease: "power2.in" }, 7.0);
</script>
