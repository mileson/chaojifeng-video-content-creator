<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #ocl-wrap { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    display: flex; align-items: center; gap: 0; }
  .ocl-card { width: 540px; border-radius: 24px; padding: 36px 40px 32px; position: relative;
    background: rgba(14, 17, 26, 0.96); box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
    will-change: transform; }
  #ocl-l { border: 1.5px solid rgba(62, 158, 255, 0.4); margin-right: 46px; }
  #ocl-r { border: 1.5px solid rgba(255, 138, 71, 0.4); margin-left: 46px; }
  .ocl-tag { display: inline-block; font-size: 21px; font-weight: 900; letter-spacing: 2px;
    border-radius: 999px; padding: 8px 20px; }
  #ocl-l .ocl-tag { color: #07131f; background: #3e9eff; }
  #ocl-r .ocl-tag { color: #1f0e02; background: #ff8a47; }
  .ocl-quote { margin-top: 20px; color: #e8ecf4; font-size: 30px; line-height: 1.6; font-weight: 700; }
  .ocl-mark { position: absolute; top: 18px; right: 28px; font-size: 90px; font-weight: 900;
    line-height: 1; opacity: 0.16; }
  #ocl-l .ocl-mark { color: #3e9eff; } #ocl-r .ocl-mark { color: #ff8a47; }
  .ocl-by { margin-top: 18px; color: #8b93a6; font-size: 23px; }
  #ocl-vs { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 3;
    width: 110px; height: 110px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #232a3c, #11141f);
    border: 3px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 0 40px rgba(0, 0, 0, 0.7), 0 0 26px rgba(179, 136, 255, 0.35);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 42px; font-weight: 900; font-style: italic; will-change: transform; }


</style>
</head>
<body>
<div id="stage">
<div id="ocl-wrap">
  <div class="ocl-card" id="ocl-l">
    <span class="ocl-tag">【立场 A】</span>
    <div class="ocl-mark">“</div>
    <div class="ocl-quote">【A 派观点，20~36 字】</div>
    <div class="ocl-by">—— 【阵营/代表者】</div>
  </div>
  <div class="ocl-card" id="ocl-r">
    <span class="ocl-tag">【立场 B】</span>
    <div class="ocl-mark">”</div>
    <div class="ocl-quote">【B 派观点，20~36 字】</div>
    <div class="ocl-by">—— 【阵营/代表者】</div>
  </div>
  <div id="ocl-vs">VS</div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  const b = gsap.timeline({ defaults: { ease: "power4.out" } });
  gsap.set("#ocl-vs", { xPercent: -50, yPercent: -50 });
  b.from("#ocl-l", { x: -280, autoAlpha: 0, duration: 0.6 }, 0.2)
    .from("#ocl-r", { x: 280, autoAlpha: 0, duration: 0.6 }, 0.32)
    .from("#ocl-vs", { scale: 0, autoAlpha: 0, duration: 0.45, ease: "back.out(2.4)" }, 0.8)
    .fromTo("#ocl-wrap", { x: "-=0" }, { keyframes: [{ x: "+=7", duration: 0.05 }, { x: "-=11", duration: 0.06 }, { x: "+=4", duration: 0.05 }], ease: "none" }, 0.86)
    .from(".ocl-quote", { y: 22, autoAlpha: 0, duration: 0.45, stagger: 0.12 }, 1.05)
    .from(".ocl-by", { autoAlpha: 0, duration: 0.4, stagger: 0.12 }, 1.5)
    .to("#ocl-l", { rotate: -1.2, duration: 1.8, yoyo: true, repeat: 1, ease: "sine.inOut" }, 2.0)
    .to("#ocl-r", { rotate: 1.2, duration: 1.8, yoyo: true, repeat: 1, ease: "sine.inOut" }, 2.0)
    .to("#ocl-wrap", { y: 70, autoAlpha: 0, duration: 0.5, ease: "power2.in" }, 6.6);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
