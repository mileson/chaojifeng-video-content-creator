<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #lri-scrim { position: absolute; inset: 0; background: linear-gradient(160deg, #0d1117, #1a2233); }
  #lri-ring { position: absolute; left: 50%; top: 44%; width: 360px; height: 360px; border-radius: 50%;
    border: 3px solid rgba(77,208,225,.8); }
  #lri-stage { position: absolute; left: 0; right: 0; top: 34%; text-align: center; }
  #lri-logo { display: inline-flex; align-items: center; gap: 22px; }
  #lri-mark { width: 110px; height: 110px; border-radius: 26px; background: linear-gradient(135deg, #4dd0e1, #2b7fd4);
    display: flex; align-items: center; justify-content: center; color: #06121a; font-size: 56px; font-weight: 900;
    box-shadow: 0 0 60px rgba(77,208,225,.5); }
  #lri-name { color: #fff; font-size: 120px; font-weight: 900; letter-spacing: 2px; }
  #lri-badge { display: inline-block; margin-top: 28px; background: rgba(255,122,89,.16); border: 1.5px solid rgba(255,122,89,.7);
    color: #ffa48c; border-radius: 99px; padding: 12px 40px; font-size: 30px; font-weight: 900; letter-spacing: 6px; }


</style>
</head>
<body>
<div id="stage">
<div id="lri-scrim" data-layout-ignore></div>
<div id="lri-ring" data-layout-ignore></div>
<div id="lri-stage">
  <div id="lri-logo"><div id="lri-mark">【首字母】</div><div id="lri-name">【产品名】</div></div>
  <div><span id="lri-badge">【正 式 发 布】</span></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  // t0 = beat 起点
  gsap.set("#lri-ring", { xPercent: -50, yPercent: -50 });
  tl.from("#lri-scrim", { autoAlpha: 0, duration: 0.35 }, t0);
  tl.from("#lri-mark", { autoAlpha: 0, scale: 2.2, rotation: -14, duration: 0.45, ease: "power4.out" }, t0 + 0.4);
  tl.from("#lri-name", { autoAlpha: 0, x: 90, duration: 0.5, ease: "power4.out" }, t0 + 0.55);
  tl.fromTo("#lri-ring", { scale: 0.3, opacity: 0.9 }, { scale: 2.6, opacity: 0, duration: 0.9, ease: "power2.out" }, t0 + 0.55);
  tl.from("#lri-badge", { autoAlpha: 0, scale: 0.5, duration: 0.5, ease: "back.out(2.2)" }, t0 + 1.2);
  tl.to("#lri-badge", { boxShadow: "0 0 36px rgba(255,122,89,.6)", duration: 0.45, yoyo: true, repeat: 2, ease: "sine.inOut" }, t0 + 1.8);
  tl.to(["#lri-stage", "#lri-scrim"], { autoAlpha: 0, duration: 0.45, ease: "power2.in" }, t0 + 4.0);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
