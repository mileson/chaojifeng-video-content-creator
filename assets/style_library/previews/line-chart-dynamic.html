<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #lc-card {
    position: absolute; top: 140px; left: 0; right: 0; margin: 0 auto;
    width: 920px;
    background: rgba(16, 18, 26, 0.9);
    border: 1.5px solid rgba(255, 255, 255, 0.14);
    border-radius: 22px; padding: 34px 44px 30px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    will-change: transform;
  }
  #lc-card h3 { color: #3e9eff; font-size: 26px; font-weight: 800; letter-spacing: 5px; margin-bottom: 8px; text-shadow: 0 0 14px rgba(62,158,255,.5); }
  #lc-card h3 em { color: #46d390; font-style: normal; }
  #lc-chart { display: block; }
  #lc-chart .grid-line { stroke: rgba(255, 255, 255, 0.08); stroke-width: 1.5; }
  #lc-chart .axis-label { fill: #8b8d98; font-size: 22px; font-weight: 700; font-family: inherit; }
  #lc-chart .pt-label { fill: #ff8589; font-size: 26px; font-weight: 900; font-family: inherit; }
  #lc-chart .pt-label.end { fill: #46d390; font-size: 34px; }
  #lc-trend { stroke: #46d390; stroke-width: 5; fill: none; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 8px rgba(70, 211, 144, 0.7)); }
  #lc-area { fill: url(#lc-fill); }
  #lc-chart .pt { fill: #fff; stroke: #46d390; stroke-width: 4; }
  #lc-chart .pt.start { stroke: #e5484d; }


</style>
</head>
<body>
<div id="stage">
<div id="lc-card">
  <h3>【ENGLISH LABEL · 中文标题 <em>强调词</em>】</h3>
  <svg id="lc-chart" width="830" height="330" viewBox="0 0 830 330">
    <defs>
      <linearGradient id="lc-fill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="rgba(70,211,144,0.35)" /><stop offset="100%" stop-color="rgba(70,211,144,0)" />
      </linearGradient>
    </defs>
    <line class="grid-line" x1="60" y1="60" x2="800" y2="60" />
    <line class="grid-line" x1="60" y1="150" x2="800" y2="150" />
    <line class="grid-line" x1="60" y1="240" x2="800" y2="240" />
    
    <path id="lc-area" d="M 90 70 L 330 160 L 570 230 L 770 258 L 770 290 L 90 290 Z" />
    <path id="lc-trend" d="M 90 70 L 330 160 L 570 230 L 770 258" />
    <circle class="pt start" id="lc-p1" cx="90" cy="70" r="9" />
    <circle class="pt" id="lc-p2" cx="330" cy="160" r="9" />
    <circle class="pt" id="lc-p3" cx="570" cy="230" r="9" />
    <circle class="pt" id="lc-p4" cx="770" cy="258" r="11" />
    <text class="pt-label" id="lc-t1" x="116" y="66">【起点标签】</text>
    <text class="axis-label" x="306" y="200">【中间点一】</text>
    <text class="axis-label" x="540" y="270">【中间点二】</text>
    <text class="pt-label end" id="lc-t4" x="600" y="240">【终点结论】</text>
    <text class="axis-label" x="88" y="320">【底部注释】</text>
  </svg>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  const b = gsap.timeline({ defaults: { ease: "power3.out" } });
  const trend = document.querySelector("#lc-trend");
  const len = trend.getTotalLength();
  gsap.set(trend, { strokeDasharray: len, strokeDashoffset: len });
  b.from("#lc-card", { y: 80, autoAlpha: 0, duration: 0.5 }, 0.15)
   .from("#lc-area", { autoAlpha: 0, duration: 0.8 }, 1.3)
   .to(trend, { strokeDashoffset: 0, duration: 1.2, ease: "power2.inOut" }, 0.7)
   .from("#lc-p1, #lc-p2, #lc-p3, #lc-p4", { scale: 0, transformOrigin: "center center", duration: 0.35, ease: "back.out(2.5)", stagger: 0.28 }, 0.7)
   .from("#lc-t1", { autoAlpha: 0, duration: 0.3 }, 0.9)
   .from("#lc-t4", { autoAlpha: 0, scale: 0.5, transformOrigin: "center center", duration: 0.45, ease: "back.out(1.8)" }, 1.9)
   .to("#lc-card", { y: 70, autoAlpha: 0, duration: 0.4, ease: "power2.in" }, 3.1);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
