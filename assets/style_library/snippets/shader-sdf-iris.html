<!--
模式：sdf-iris 金圈虹膜转场（WebGL shader · 透明覆盖）【参数化框架 · 响应式 v2】
来源：Hyperframes 官方 catalog shader block（transition-shader-pack 的 FRAG_IR），单形态独立实现（Apache-2.0，署名见 THIRD_PARTY_NOTICES.md）。
适用：仪式感开场/重点章节，电影光圈语义；进退共用 from=透明 to=场景，进场 p 0→1 揭开、退场 p 1→0 收拢（唯一一个进退同纹理方向的形态）。
框架参数：
  - ir_num 编号行 / ir_title 章节标题 / ir_en 英文副题
机制：DOM 章节卡 capture 成 WebGL 纹理 → fragment shader 过渡 → GSAP 驱动 u_progress。
铁律：
  - canvas 保持透明，只渲染章节文字和金色光圈，原视频由宿主保留
  - 父容器 data-layout-ignore；preserveDrawingBuffer: true 必须保留
  - 场景 DOM 只放文本（capture walker 不支持图片/渐变）
响应式：canvas/capture 尺寸 = 渲染分辨率（JS 读取 viewport）；场景文字 vw 自适应，
  竖屏媒体查询放大；节奏按 3.5s 基准等比缩放；挂宿主 tl。
-->
<style>
  #ir-scene { position: absolute; inset: 0; background: transparent; opacity: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.56vw; }
  #ir-num { font: 600 1.56vw/1 "PingFang SC", sans-serif; color: #ffb224; letter-spacing: 0.73vw; text-shadow: 0 0.14em 0.5em rgba(0,0,0,.86); }
  #ir-title { font: 800 5.73vw/1.2 "PingFang SC", sans-serif; color: #ffffff; letter-spacing: 0.31vw; text-shadow: 0 0.08em 0.35em rgba(0,0,0,.9); }
  #ir-en { font: 500 1.35vw/1 "PingFang SC", sans-serif; color: #d5d7df; letter-spacing: 0.52vw; text-shadow: 0 0.14em 0.5em rgba(0,0,0,.86); }
  @media (max-aspect-ratio: 4/5) {
    #ir-scene { gap: 3.5vw; }
    #ir-num { font-size: 3.9vw; letter-spacing: 1.6vw; }
    #ir-title { font-size: 11vw; letter-spacing: 0.7vw; }
    #ir-en { font-size: 3.2vw; letter-spacing: 1.1vw; }
  }
</style>

<div data-layout-ignore style="position: absolute; inset: 0">
  <div id="ir-scene">
    <div id="ir-num">【ir_num】</div>
    <div id="ir-title">【ir_title】</div>
    <div id="ir-en">【ir_en】</div>
  </div>
  <canvas id="ir-canvas" style="position: absolute; inset: 0; opacity: 0; display: block"></canvas>
</div>

<script>
(function () {
  var W = window.innerWidth || 1920, H = window.innerHeight || 1080;
  var canvas = document.getElementById("ir-canvas");
  canvas.width = W; canvas.height = H;
  var tlBeat = (typeof tl !== "undefined" && tl) ? tl : gsap.timeline();
  var irEnd = (typeof tEnd !== "undefined" && tEnd) ? tEnd : 3.5;
  var r = irEnd / 3.5;
  var gl = canvas.getContext("webgl", { alpha: true, premultipliedAlpha: false, preserveDrawingBuffer: true });
  if (!gl) {
    // 无 WebGL 降级：透明背景上的普通章节文字
    tlBeat.to("#ir-scene", { opacity: 1, duration: 0.3 * r }, 0.2 * r);
    tlBeat.to("#ir-scene", { opacity: 0, duration: 0.3 * r }, 3.0 * r);
    return;
  }
  gl.viewport(0, 0, W, H);

  function texFromCanvas2D(c) {
    var tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
    return tex;
  }
  function captureScene() {
    var scene = document.getElementById("ir-scene");
    scene.style.opacity = "1";
    scene.offsetHeight;
    var c = document.createElement("canvas");
    c.width = W; c.height = H;
    var ctx = c.getContext("2d");
    var sr = scene.getBoundingClientRect();
    var sx = W / sr.width, sy = H / sr.height;
    scene.querySelectorAll("*").forEach(function (el) {
      var cs = window.getComputedStyle(el);
      if (cs.display === "none" || cs.visibility === "hidden") return;
      var rect = el.getBoundingClientRect();
      if (rect.width < 1 || rect.height < 1) return;
      var x = (rect.left - sr.left) * sx, y = (rect.top - sr.top) * sy;
      var w = rect.width * sx, h = rect.height * sy;
      var bg = cs.backgroundColor;
      if (bg && bg !== "rgba(0, 0, 0, 0)" && bg !== "transparent") {
        ctx.fillStyle = bg; ctx.fillRect(x, y, w, h);
      }
      var text = "";
      el.childNodes.forEach(function (n) { if (n.nodeType === 3) text += n.textContent; });
      text = text.trim();
      if (text && !el.querySelector("div,span")) {
        ctx.font = cs.fontWeight + " " + parseFloat(cs.fontSize) + "px " + cs.fontFamily;
        ctx.fillStyle = cs.color;
        if (cs.letterSpacing && cs.letterSpacing !== "normal")
          ctx.letterSpacing = parseFloat(cs.letterSpacing) + "px";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.save();
        ctx.shadowColor = "rgba(0,0,0,.82)";
        ctx.shadowBlur = Math.max(4, parseFloat(cs.fontSize) * .16);
        ctx.shadowOffsetY = Math.max(2, parseFloat(cs.fontSize) * .04);
        ctx.strokeStyle = "rgba(0,0,0,.55)";
        ctx.lineWidth = Math.max(2, parseFloat(cs.fontSize) * .045);
        ctx.lineJoin = "round";
        ctx.strokeText(text, x + w / 2, y + h / 2);
        ctx.fillText(text, x + w / 2, y + h / 2);
        ctx.restore();
      }
    });
    scene.style.opacity = "0";
    return texFromCanvas2D(c);
  }
  function transparentTexture() {
    var tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 0]));
    return tex;
  }

  var vertSrc = "attribute vec2 a_pos; varying vec2 v_uv; void main(){v_uv=a_pos*0.5+0.5; v_uv.y=1.0-v_uv.y; gl_Position=vec4(a_pos,0,1);}";
  var quadBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  function compile(src, type) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  }
  function mkProg(fragSrc) {
    var p = gl.createProgram();
    gl.attachShader(p, compile(vertSrc, gl.VERTEX_SHADER));
    gl.attachShader(p, compile(fragSrc, gl.FRAGMENT_SHADER));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
    return p;
  }
  var HH = "precision mediump float;varying vec2 v_uv;uniform sampler2D u_from,u_to;uniform float u_progress;uniform vec2 u_resolution;\n";
  var progPass = mkProg(HH + "void main(){gl_FragColor=texture2D(u_from,v_uv);}");
  // FRAG_IR：透明章节文字的 SDF 光圈 + 三重金色辉光环
  var progTrans = mkProg(HH + "void main(){vec4 A=texture2D(u_from,v_uv),B=texture2D(u_to,v_uv);vec2 uv=(v_uv-.5)*vec2(u_resolution.x/u_resolution.y,1.);float d=length(uv);float radius=u_progress*1.2;float fw=.003;float edge=smoothstep(radius+fw,radius-fw,d);float ring1=exp(-abs(d-radius)*25.);float ring2=exp(-abs(d-radius+.04)*20.)*.5;float ring3=exp(-abs(d-radius+.08)*15.)*.25;float glow=(ring1+ring2+ring3)*u_progress*(1.-u_progress)*4.;vec4 content=mix(A,B,edge);float ringA=min(glow*.34,.7);float outA=1.-(1.-content.a)*(1.-ringA);vec3 outRGB=content.rgb+vec3(1.,.78,.32)*ringA;gl_FragColor=vec4(outRGB,outA);}");

  function renderShader(prog, texFrom, texTo, p) {
    gl.useProgram(prog);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texFrom);
    gl.uniform1i(gl.getUniformLocation(prog, "u_from"), 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texTo);
    gl.uniform1i(gl.getUniformLocation(prog, "u_to"), 1);
    gl.uniform1f(gl.getUniformLocation(prog, "u_progress"), p);
    gl.uniform2f(gl.getUniformLocation(prog, "u_resolution"), W, H);
    var pos = gl.getAttribLocation(prog, "a_pos");
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.enableVertexAttribArray(pos);
    gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  var texScene = captureScene();
  var texTransparent = transparentTexture();
  renderShader(progPass, texTransparent, texTransparent, 0);

  var st = { p: 0 };
  tlBeat.to("#ir-canvas", { autoAlpha: 1, duration: 0.25 * r, ease: "power2.in" }, 0);
  tlBeat.to(st, { p: 1, duration: 0.8 * r, ease: "power2.inOut",
    onUpdate: function () { renderShader(progTrans, texTransparent, texScene, st.p); } }, 0.25 * r);
  tlBeat.to(st, { p: 0, duration: 0.7 * r, ease: "power2.inOut",
    onUpdate: function () { renderShader(progTrans, texTransparent, texScene, st.p); },
    onComplete: function () { renderShader(progPass, texTransparent, texTransparent, 0); } }, 2.55 * r);
  tlBeat.to("#ir-canvas", { autoAlpha: 0, duration: 0.25 * r, ease: "power2.out" }, 3.25 * r);
})();
</script>
