<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #acs-card {
    position: absolute; top: 170px; left: 50%; width: 800px;
    background: rgba(14, 16, 24, 0.95); border: 1.5px solid rgba(255, 255, 255, 0.13);
    border-radius: 22px; box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6);
    padding: 24px 28px 30px; will-change: transform;
  }
  #acs-head { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  #acs-head i { width: 14px; height: 14px; border-radius: 50%;
    background: linear-gradient(135deg, #46d390, #3e9eff); box-shadow: 0 0 12px rgba(70, 211, 144, 0.8); }
  #acs-head b { color: #d4dae6; font-size: 24px; font-weight: 800; letter-spacing: 2px; }
  .acs-bub { max-width: 86%; border-radius: 18px; padding: 18px 24px; font-size: 27px;
    line-height: 1.65; will-change: transform; }
  #acs-q { margin-left: auto; background: linear-gradient(135deg, #2f6fed, #3e9eff);
    color: #fff; font-weight: 700; border-bottom-right-radius: 6px; }
  #acs-a { display: flex; gap: 14px; margin-top: 18px; background: rgba(255, 255, 255, 0.07);
    color: #e6eaf2; border: 1px solid rgba(255, 255, 255, 0.10); border-bottom-left-radius: 6px; }
  #acs-a .av { flex: none; width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, #b388ff, #3e9eff);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 20px; font-weight: 900; }
  #acs-out em { color: #46d390; font-style: normal; font-weight: 800; }
  .acs-cursor { display: inline-block; width: 13px; height: 28px; margin-left: 4px;
    vertical-align: -4px; background: #46d390; border-radius: 3px; }


</style>
</head>
<body>
<div id="stage">
<div id="acs-card">
  <div id="acs-head"><i></i><b>【模型名 · Nova 5】</b></div>
  <div class="acs-bub" id="acs-q">【用户的问题，一句话】</div>
  <div class="acs-bub" id="acs-a">
    <span class="av">AI</span>
    <span><span id="acs-out"></span><span class="acs-cursor" id="acs-cur"></span></span>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  const b = gsap.timeline({ defaults: { ease: "power3.out" } });
  // 流式文案：可带 <em> 强调（按字符流式时保持标签完整：用 token 数组而非裸字符串切片）
  const ACS_TOKENS = ("【流式输出的回答文案，建议 40~80 字，关键词用强调色】").split("");
  gsap.set("#acs-card", { xPercent: -50 });
  gsap.set("#acs-a", { autoAlpha: 0 });
  b.from("#acs-card", { y: 90, autoAlpha: 0, duration: 0.55 }, 0.15)
    .from("#acs-q", { scale: 0.7, autoAlpha: 0, duration: 0.5, ease: "back.out(1.8)" }, 0.55)
    .to("#acs-a", { autoAlpha: 1, duration: 0.35 }, 1.35);
  const acsSt = { n: 0 };
  b.to(acsSt, { n: ACS_TOKENS.length, duration: ACS_TOKENS.length * 0.045, ease: "none",
    onUpdate() { document.getElementById("acs-out").textContent = ACS_TOKENS.slice(0, Math.round(acsSt.n)).join(""); } }, 1.6);
  // 输出期间光标闪烁，结束后隐藏
  b.to("#acs-cur", { autoAlpha: 0, duration: 0.4, yoyo: true, repeat: 7, ease: "steps(1)" }, 1.6)
    .set("#acs-cur", { display: "none" }, "+=0.1")
    .to("#acs-card", { y: -60, autoAlpha: 0, duration: 0.5, ease: "power2.in" }, 7.2);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
