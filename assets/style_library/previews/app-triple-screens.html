<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #ats-stage { position: absolute; inset: 0; }
  .ats-phone {
    /* 居中只用 gsap xPercent -50，勿再加 margin-left（双重偏移） */
    position: absolute; top: 130px; left: 50%; width: 360px; height: 740px;
    border-radius: 48px; background: #15171f;
    border: 2px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 40px 100px rgba(0, 0, 0, 0.65), inset 0 0 0 6px #07080c;
    padding: 14px; will-change: transform;
  }
  .ats-phone .scr {
    width: 100%; height: 100%; border-radius: 36px; overflow: hidden;
    background: linear-gradient(160deg, #1d2940, #11182a);
  }
  .ats-phone .scr img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ats-phone .notch {
    position: absolute; top: 26px; left: 50%; transform: translateX(-50%);
    width: 110px; height: 26px; border-radius: 14px; background: #07080c; z-index: 2;
  }
  #ats-l { z-index: 1; } #ats-r { z-index: 1; } #ats-c { z-index: 3; }
  #ats-foot {
    position: absolute; bottom: 86px; left: 0; right: 0; text-align: center; will-change: transform;
  }
  #ats-foot b { color: #fff; font-size: 44px; font-weight: 900; letter-spacing: 3px;
    text-shadow: 0 2px 24px rgba(0, 0, 0, 0.8); }
  #ats-foot span { display: block; margin-top: 10px; color: #aeb6c5; font-size: 26px; letter-spacing: 2px; }


</style>
</head>
<body>
<div id="stage">
<div id="ats-stage">
  <div class="ats-phone" id="ats-l"><div class="notch"></div><div class="scr"><img src="assets/screen-left.png" alt="" /></div></div>
  <div class="ats-phone" id="ats-r"><div class="notch"></div><div class="scr"><img src="assets/screen-right.png" alt="" /></div></div>
  <div class="ats-phone" id="ats-c"><div class="notch"></div><div class="scr"><img src="assets/screen-main.png" alt="" /></div></div>
  <div id="ats-foot"><b>【产品名】</b><span>【一句话定位 · 三个核心界面】</span></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  const b = gsap.timeline({ defaults: { ease: "power3.out" } });
  gsap.set("#ats-l", { xPercent: -50, scale: 0.82, filter: "brightness(.55) blur(.5px)", rotateY: 6 });
  gsap.set("#ats-r", { xPercent: -50, scale: 0.82, filter: "brightness(.55) blur(.5px)", rotateY: -6 });
  gsap.set("#ats-c", { xPercent: -50 });
  b.from("#ats-c", { y: 140, autoAlpha: 0, duration: 0.7, ease: "back.out(1.3)" }, 0.15)
    .to("#ats-l", { x: -330, duration: 0.65, ease: "power3.inOut" }, 0.55)
    .to("#ats-r", { x: 330, duration: 0.65, ease: "power3.inOut" }, 0.67)
    .from(["#ats-l", "#ats-r"], { autoAlpha: 0, duration: 0.4 }, 0.55)
    .from("#ats-foot", { y: 50, autoAlpha: 0, duration: 0.5 }, 1.1);
  // 悬浮呼吸：三屏周期错开
  b.to("#ats-c", { y: -10, duration: 1.6, yoyo: true, repeat: 3, ease: "sine.inOut" }, 1.3);
  b.to("#ats-l", { y: -8, duration: 1.9, yoyo: true, repeat: 2, ease: "sine.inOut" }, 1.5);
  b.to("#ats-r", { y: -12, duration: 1.7, yoyo: true, repeat: 2, ease: "sine.inOut" }, 1.4);
  b.to("#ats-stage", { y: 80, autoAlpha: 0, duration: 0.5, ease: "power2.in" }, 7.4);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
