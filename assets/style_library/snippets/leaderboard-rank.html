<!--
模式：排行榜名次竞速（模型评测/产品榜单）
适用场景：模型 benchmark 排名、产品榜单、「第一名是谁」悬念揭晓。
结构要点：
  - 4 行排行：名次徽章（金/银/铜/灰）+ 名称 + 分数条 + 分值
  - 分数条按分值比例 scaleX 画出（transform-origin 左侧），第一名条用渐变 + 发光
  - 第一名行 .top：渐变描边 + 微放大，最后入场制造揭晓感
动画要点：
  - 行从下往上 stagger 入场（第 4 → 第 1，名次低的先出，第一名压轴）
  - 分数条 scaleX 0→比例 同拍画出 + 分值 count-up
  - 第一名揭晓拍：行放大 1.04 + 金光脉冲 + 名次徽章 rotate 弹入
参数：榜单数据（名称/分数/比例）/榜单标题；行数 3~6
-->
<style>
  #lbr-card { position: absolute; top: 50%; left: 50%; width: 780px;
    background: rgba(14, 16, 25, 0.96); border: 1.5px solid rgba(255, 255, 255, 0.13);
    border-radius: 24px; box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6);
    padding: 34px 40px 38px; will-change: transform; }
  #lbr-card h3 { color: #3e9eff; font-size: 27px; font-weight: 900; letter-spacing: 4px;
    margin-bottom: 26px; text-shadow: 0 0 14px rgba(62, 158, 255, 0.5); }
  .lbr-row { display: flex; align-items: center; gap: 18px; padding: 13px 18px;
    border-radius: 16px; will-change: transform; }
  .lbr-rank { flex: none; width: 52px; height: 52px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 27px; font-weight: 900; color: #0c0e14; will-change: transform; }
  .r1 { background: linear-gradient(135deg, #ffd95e, #ffb224); box-shadow: 0 0 22px rgba(255, 178, 36, 0.6); }
  .r2 { background: linear-gradient(135deg, #e8ecf4, #aab4c4); }
  .r3 { background: linear-gradient(135deg, #e8a06b, #c4763f); }
  .r4 { background: rgba(255, 255, 255, 0.16); color: #c4cbd9; }
  .lbr-name { width: 200px; color: #e6eaf2; font-size: 28px; font-weight: 800; }
  .lbr-track { flex: 1; height: 22px; border-radius: 999px; background: rgba(255, 255, 255, 0.07); overflow: hidden; }
  .lbr-bar { height: 100%; border-radius: 999px; transform-origin: 0 50%;
    background: linear-gradient(90deg, #2f6fed, #3e9eff); }
  .lbr-row.top .lbr-bar { background: linear-gradient(90deg, #ffb224, #ffd95e);
    box-shadow: 0 0 16px rgba(255, 178, 36, 0.7); }
  .lbr-val { flex: none; width: 96px; text-align: right; color: #fff; font-size: 28px;
    font-weight: 900; font-variant-numeric: tabular-nums; }
  .lbr-row.top { border: 1.5px solid rgba(255, 178, 36, 0.45); background: rgba(255, 178, 36, 0.06); }
</style>

<div id="lbr-card">
  <h3>【榜单标题 · BENCHMARK】</h3>
  <div class="lbr-row top"><div class="lbr-rank r1">1</div><div class="lbr-name">【第一名】</div><div class="lbr-track"><div class="lbr-bar" data-p="0.96"></div></div><div class="lbr-val" data-v="96.2">0</div></div>
  <div class="lbr-row"><div class="lbr-rank r2">2</div><div class="lbr-name">【第二名】</div><div class="lbr-track"><div class="lbr-bar" data-p="0.88"></div></div><div class="lbr-val" data-v="88.4">0</div></div>
  <div class="lbr-row"><div class="lbr-rank r3">3</div><div class="lbr-name">【第三名】</div><div class="lbr-track"><div class="lbr-bar" data-p="0.79"></div></div><div class="lbr-val" data-v="79.1">0</div></div>
  <div class="lbr-row"><div class="lbr-rank r4">4</div><div class="lbr-name">【第四名】</div><div class="lbr-track"><div class="lbr-bar" data-p="0.71"></div></div><div class="lbr-val" data-v="71.5">0</div></div>
</div>

<script>
  const b = gsap.timeline({ defaults: { ease: "power3.out" } });
  gsap.set("#lbr-card", { xPercent: -50, yPercent: -50 });
  gsap.set(".lbr-bar", { scaleX: 0 });
  b.from("#lbr-card", { y: "+=90", autoAlpha: 0, duration: 0.55 }, 0.15);
  // 名次低的先入，第一名压轴揭晓
  const lbrRows = Array.from(document.querySelectorAll(".lbr-row")).reverse();
  lbrRows.forEach((row, i) => {
    const t = 0.55 + i * 0.28;
    b.from(row, { y: 34, autoAlpha: 0, duration: 0.45 }, t);
    const bar = row.querySelector(".lbr-bar"), val = row.querySelector(".lbr-val");
    b.to(bar, { scaleX: +bar.dataset.p, duration: 0.7, ease: "power2.inOut" }, t + 0.15);
    const st = { v: 0 };
    b.to(st, { v: +val.dataset.v, duration: 0.7, ease: "power1.out",
      onUpdate() { val.textContent = st.v.toFixed(1); } }, t + 0.15);
  });
  b.from(".lbr-row.top .lbr-rank", { rotate: -180, scale: 0, duration: 0.5, ease: "back.out(2)" }, 1.7)
    .to(".lbr-row.top", { scale: 1.04, duration: 0.4, ease: "back.out(1.8)" }, 2.0)
    .fromTo(".lbr-row.top", { boxShadow: "0 0 0 rgba(255,178,36,0)" },
      { boxShadow: "0 0 40px rgba(255,178,36,.3)", duration: 0.5, yoyo: true, repeat: 1 }, 2.05)
    .to("#lbr-card", { y: "+=70", autoAlpha: 0, duration: 0.5, ease: "power2.in" }, 6.8);
</script>
