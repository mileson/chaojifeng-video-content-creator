<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  .corner-tag {
    position: absolute; top: 56px; left: 72px;
    background: rgba(8, 10, 16, 0.8); border-radius: 12px;
    padding: 14px 22px 12px; border: 1px solid rgba(255, 255, 255, 0.12);
  }
  .corner-tag .row1 { display: flex; align-items: center; gap: 12px; }
  .corner-tag .bar { width: 5px; height: 26px; background: #ffb224; }
  .corner-tag .en { font-size: 23px; font-weight: 800; letter-spacing: 6px; color: #ffb224; text-shadow: 0 0 12px rgba(255,178,36,.6); }
  .corner-tag .cn { color: #c8cad3; font-size: 21px; font-weight: 700; margin-top: 8px; letter-spacing: 2px; }

  #sc-row { position: absolute; top: 170px; left: 0; right: 0; margin: 0 auto; width: fit-content; display: flex; align-items: center; gap: 30px; }
  .state-card {
    width: 380px; border-radius: 16px; padding: 26px 30px 30px; text-align: center;
    background: rgba(12, 14, 22, 0.88); will-change: transform;
  }
  .state-card .en { font-size: 26px; font-weight: 900; letter-spacing: 4px; }
  .state-card .cn { color: #e8e8ec; font-size: 28px; font-weight: 700; margin-top: 10px; }
  .state-card .glyph { font-size: 64px; font-weight: 900; margin-top: 18px; }
  .state-card.tone-red { border: 2px solid #e5484d; box-shadow: 0 0 28px rgba(229, 72, 77, 0.35); }
  .state-card.tone-red .en, .state-card.tone-red .glyph { color: #ff8589; text-shadow: 0 0 14px rgba(229,72,77,.6); }
  .state-card.tone-green { border: 2px solid #30a46c; box-shadow: 0 0 32px rgba(48, 164, 108, 0.45), inset 0 0 20px rgba(48,164,108,.12); }
  .state-card.tone-green .en, .state-card.tone-green .glyph { color: #46d390; text-shadow: 0 0 14px rgba(70,211,144,.6); }
  .arrow-note {
    text-align: center; will-change: transform;
    background: rgba(8, 10, 16, 0.8); border-radius: 12px; padding: 12px 18px;
  }
  .arrow-note .lab { color: #ffb224; font-size: 25px; font-weight: 900; letter-spacing: 4px; text-shadow: 0 0 12px rgba(255,178,36,.6); }
  .arrow-note .arr { color: #ffb224; font-size: 60px; font-weight: 900; line-height: 1; text-shadow: 0 0 20px rgba(255,178,36,.7); }
  .arrow-note .sub { color: #c8cad3; font-size: 21px; font-weight: 700; margin-top: 4px; }


</style>
</head>
<body>
<div id="stage">
<div class="corner-tag" id="sc-tag">
  <div class="row1"><div class="bar"></div><span class="en">【ENGLISH TAG · 中文】</span></div>
  <div class="cn">【角标副行说明】</div>
</div>
<div id="sc-row">
  <div class="state-card tone-red" id="sc-c1">
    <div class="en">【STATE A】</div>
    <div class="cn">【状态 A 描述】</div>
    <div class="glyph">【⌘】</div>
  </div>
  <div class="arrow-note" id="sc-arr">
    <div class="lab">【转化条件】</div>
    <div class="arr">→</div>
    <div class="sub">【条件副注】</div>
  </div>
  <div class="state-card tone-green" id="sc-c2">
    <div class="en">【STATE B】</div>
    <div class="cn">【状态 B 描述】</div>
    <div class="glyph">【★】</div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  const b = gsap.timeline({ defaults: { ease: "power3.out" } });
  b.from("#sc-tag", { x: -60, autoAlpha: 0, duration: 0.45 }, 0.1)
   .from("#sc-c1", { x: -110, autoAlpha: 0, duration: 0.5 }, 0.4)
   .from("#sc-arr", { scale: 0, autoAlpha: 0, duration: 0.45, ease: "back.out(2)" }, 1.0)
   .to("#sc-arr .arr", { x: 12, duration: 0.35, ease: "power1.inOut", repeat: 5, yoyo: true }, 1.45)
   .from("#sc-c2", { x: 110, autoAlpha: 0, scale: 0.9, duration: 0.55, ease: "back.out(1.5)" }, 1.35)
   .to("#sc-c2", { scale: 1.04, duration: 0.3, ease: "power1.inOut", repeat: 3, yoyo: true }, 2.3)
   .to("#sc-tag, #sc-row", { y: -60, autoAlpha: 0, duration: 0.4, ease: "power2.in" }, 4.1);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
