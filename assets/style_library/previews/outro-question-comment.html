<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #oqc-bg { position: absolute; inset: 0;
    background: radial-gradient(130% 100% at 50% 0%, #201a33 0%, #100d1e 58%, #090712 100%); }
  #oqc-kicker { position: absolute; left: 50%; top: 170px; transform: translateX(-50%);
    color: #b388ff; font-size: 24px; font-weight: 800; letter-spacing: 8px; }
  #oqc-q { position: absolute; left: 50%; top: 44%; transform: translate(-50%, -50%);
    color: #f4f7ff; font-size: 76px; font-weight: 900; white-space: nowrap; letter-spacing: 2px; }
  #oqc-q b { color: #b388ff; display: inline-block; font-size: 96px; }
  .oqc-bubble { position: absolute; max-width: 430px; padding: 18px 26px; border-radius: 20px;
    font-size: 24px; font-weight: 700; line-height: 1.5; color: #dde4f0;
    background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14);
    box-shadow: 0 16px 44px rgba(0,0,0,.4); }
  .oqc-bubble i { display: block; font-style: normal; font-size: 18px; color: #8b96ac; margin-bottom: 6px; }
  #oqc-b1 { left: 160px; top: 230px; }
  #oqc-b2 { right: 170px; top: 280px; }
  #oqc-b3 { left: 230px; bottom: 230px; }
  #oqc-b4 { right: 220px; bottom: 200px; border-color: rgba(179,136,255,.45); }
  #oqc-cta { position: absolute; left: 50%; bottom: 100px; transform: translateX(-50%);
    color: #fff; font-size: 28px; font-weight: 900; letter-spacing: 4px; white-space: nowrap;
    background: linear-gradient(135deg, #7c4dff, #b388ff); border-radius: 99px; padding: 17px 52px;
    box-shadow: 0 14px 44px rgba(124,77,255,.4); }


</style>
</head>
<body>
<div id="stage">
<div id="oqc-bg" data-layout-allow-overflow></div>
<div id="oqc-kicker">YOUR TURN · 该你说了</div>
<div id="oqc-q">AI 成本，该省还是该花<b>？</b></div>
<div class="oqc-bubble" id="oqc-b1"><i>@读者甲</i>能省一块是一块，现金流才是命</div>
<div class="oqc-bubble" id="oqc-b2"><i>@读者乙</i>省出来的都是体验债，迟早要还</div>
<div class="oqc-bubble" id="oqc-b3"><i>@读者丙</i>先跑通再优化，顺序别搞反了</div>
<div class="oqc-bubble" id="oqc-b4"><i>@你</i>评论区等你的答案……</div>
<div id="oqc-cta">评论区聊聊你的选择</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  tl.from("#oqc-bg", { autoAlpha: 0, duration: 0.6 }, t0);
  tl.from("#oqc-kicker", { autoAlpha: 0, y: -20, duration: 0.45 }, t0 + 0.35);
  tl.from("#oqc-q", { autoAlpha: 0, scale: 0.85, duration: 0.6, ease: "back.out(1.6)" }, t0 + 0.55);
  tl.from("#oqc-q b", { scale: 0, rotation: 24, duration: 0.7, ease: "elastic.out(1, 0.45)" }, t0 + 1.0);
  var dirs = [{ x: -90, y: -50 }, { x: 90, y: -50 }, { x: -90, y: 60 }, { x: 90, y: 60 }];
  ["#oqc-b1", "#oqc-b2", "#oqc-b3", "#oqc-b4"].forEach(function (sel, i) {
    tl.from(sel, { autoAlpha: 0, x: dirs[i].x, y: dirs[i].y, duration: 0.55, ease: "power3.out" },
      t0 + 1.5 + i * 0.35);
    tl.to(sel, { y: "+=" + (i % 2 ? 8 : -8), duration: 1.4 + i * 0.2, yoyo: true, repeat: 3,
      ease: "sine.inOut" }, t0 + 2.2 + i * 0.35);
  });
  tl.from("#oqc-cta", { autoAlpha: 0, y: 26, scale: 0.9, duration: 0.5, ease: "back.out(2)" }, t0 + 3.4);
  tl.to("#oqc-cta", { boxShadow: "0 14px 60px rgba(124,77,255,.75)", duration: 0.7,
    yoyo: true, repeat: 3, ease: "sine.inOut" }, t0 + 4.0);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
