<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #cdf-card {
    position: absolute; top: 200px; left: 50%; width: 880px;
    background: rgba(12, 14, 20, 0.97); border: 1.5px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px; box-shadow: 0 30px 90px rgba(0, 0, 0, 0.6); overflow: hidden; will-change: transform;
  }
  #cdf-tab { display: inline-flex; align-items: center; gap: 10px; margin: 14px 0 0 18px;
    background: rgba(255, 255, 255, 0.07); color: #cfd6e4; font: 600 21px/1 "SF Mono", monospace;
    border-radius: 10px 10px 0 0; padding: 12px 22px; }
  #cdf-tab i { width: 10px; height: 10px; border-radius: 50%; background: #3e9eff; }
  #cdf-body { border-top: 1px solid rgba(255, 255, 255, 0.08); padding: 16px 0 20px;
    font: 500 23px/1.85 "SF Mono", "Menlo", monospace; }
  .cdf-ln { display: flex; color: #8089a0; padding: 0 24px; will-change: transform; position: relative; }
  .cdf-ln .no { width: 56px; color: #4a5266; flex: none; user-select: none; }
  .cdf-ln .sg { width: 34px; flex: none; font-weight: 800; }
  .cdf-ln.del { background: rgba(255, 95, 87, 0.10); color: #e8a09b; }
  .cdf-ln.del .sg { color: #ff5f57; }
  .cdf-ln.add { background: rgba(70, 211, 144, 0.12); color: #b6ecd2; }
  .cdf-ln.add .sg { color: #46d390; }
  .cdf-strike { position: absolute; left: 110px; right: 30px; top: 50%; height: 2.5px;
    background: #ff5f57; transform-origin: 0 50%; }
  .cdf-k { color: #79b8ff; } .cdf-s { color: #ffd479; }


</style>
</head>
<body>
<div id="stage">
<div id="cdf-card">
  <div id="cdf-tab"><i></i>【config.ts · 只改一行】</div>
  <div id="cdf-body">
    <div class="cdf-ln"><span class="no">12</span><span class="sg"> </span><span>export const config = {</span></div>
    <div class="cdf-ln"><span class="no">13</span><span class="sg"> </span><span>&nbsp;&nbsp;retries: 3,</span></div>
    <div class="cdf-ln del"><span class="no">14</span><span class="sg">−</span><span>&nbsp;&nbsp;<span class="cdf-k">model</span>: <span class="cdf-s">"【旧值】"</span>,</span><i class="cdf-strike"></i></div>
    <div class="cdf-ln add"><span class="no">14</span><span class="sg">+</span><span>&nbsp;&nbsp;<span class="cdf-k">model</span>: <span class="cdf-s">"【新值】"</span>,</span></div>
    <div class="cdf-ln"><span class="no">15</span><span class="sg"> </span><span>&nbsp;&nbsp;stream: true,</span></div>
    <div class="cdf-ln"><span class="no">16</span><span class="sg"> </span><span>};</span></div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  const b = gsap.timeline({ defaults: { ease: "power3.out" } });
  gsap.set("#cdf-card", { xPercent: -50 });
  gsap.set(".cdf-strike", { scaleX: 0 });
  b.from("#cdf-card", { y: 90, autoAlpha: 0, duration: 0.55 }, 0.15)
    .from(".cdf-ln:not(.add)", { x: -20, autoAlpha: 0, duration: 0.35, stagger: 0.05 }, 0.5)
    .to(".cdf-strike", { scaleX: 1, duration: 0.45, ease: "power2.inOut" }, 1.25)
    .from(".cdf-ln.add", { x: -46, autoAlpha: 0, duration: 0.5, ease: "back.out(1.6)" }, 1.6)
    .fromTo(".cdf-ln.add", { backgroundColor: "rgba(70,211,144,.32)" },
      { backgroundColor: "rgba(70,211,144,.12)", duration: 0.8 }, 2.1)
    .to("#cdf-card", { y: -60, autoAlpha: 0, duration: 0.5, ease: "power2.in" }, 6.2);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
