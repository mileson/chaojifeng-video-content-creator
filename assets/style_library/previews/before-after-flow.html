<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #ba-up { position: absolute; top: 150px; left: 0; right: 0; margin: 0 auto; width: fit-content; color: #46d390; font-size: 24px; font-weight: 800; letter-spacing: 6px; text-shadow: 0 0 14px rgba(70,211,144,.6); }
  #ba-flow { position: absolute; top: 200px; left: 0; right: 0; margin: 0 auto; width: fit-content; display: flex; align-items: center; gap: 34px; }
  #ba-flow .step { border-radius: 16px; padding: 24px 34px; will-change: transform; }
  #ba-old { background: rgba(24, 26, 34, 0.88); border: 1.5px solid rgba(255, 255, 255, 0.14); }
  #ba-old .en { color: #8b8d98; font-size: 24px; font-weight: 800; letter-spacing: 3px; text-decoration: line-through; text-decoration-color: #e5484d; text-decoration-thickness: 3px; }
  #ba-old .cn { color: #a0a3ad; font-size: 30px; font-weight: 700; margin-top: 8px; text-decoration: line-through; text-decoration-color: #e5484d; text-decoration-thickness: 3px; }
  #ba-arrow { color: #46d390; font-size: 64px; font-weight: 900; text-shadow: 0 0 22px rgba(70, 211, 144, 0.8); will-change: transform; }
  #ba-new {
    background: rgba(13, 35, 24, 0.9);
    border: 2px solid #30a46c;
    box-shadow: 0 0 36px rgba(48, 164, 108, 0.55), inset 0 0 24px rgba(48, 164, 108, 0.15);
  }
  #ba-new .en { color: #46d390; font-size: 24px; font-weight: 800; letter-spacing: 3px; text-shadow: 0 0 12px rgba(70, 211, 144, 0.7); }
  #ba-new .cn { color: #fff; font-size: 30px; font-weight: 800; margin-top: 8px; }


</style>
</head>
<body>
<div id="stage">
<div id="ba-up">【UPGRADED · 变更主题】</div>
<div id="ba-flow">
  <div class="step" id="ba-old"><div class="en">【OLD WAY】</div><div class="cn">【旧方式描述】</div></div>
  <div id="ba-arrow">→</div>
  <div class="step" id="ba-new"><div class="en">【NEW WAY】</div><div class="cn">【新方式描述】</div></div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  const b = gsap.timeline({ defaults: { ease: "power3.out" } });
  b.from("#ba-up", { y: -40, autoAlpha: 0, duration: 0.4 }, 0.15)
   .from("#ba-old", { x: -120, autoAlpha: 0, duration: 0.5 }, 0.4)
   .from("#ba-arrow", { scale: 0, autoAlpha: 0, duration: 0.45, ease: "back.out(2)" }, 1.0)
   .to("#ba-arrow", { x: 14, duration: 0.35, ease: "power1.inOut", repeat: 5, yoyo: true }, 1.45)
   .from("#ba-new", { x: 120, autoAlpha: 0, scale: 0.9, duration: 0.55, ease: "back.out(1.5)" }, 1.35)
   .to("#ba-new", { scale: 1.04, duration: 0.3, ease: "power1.inOut", repeat: 3, yoyo: true }, 2.2)
   .to("#ba-up, #ba-flow", { y: -60, autoAlpha: 0, duration: 0.4, ease: "power2.in" }, 5.1);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
