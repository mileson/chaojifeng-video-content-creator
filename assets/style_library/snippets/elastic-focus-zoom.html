<!--
模式：弹簧伸缩转场（elastic-focus-zoom）【转场层 · 组合动画】
适用场景：把一段画面用短促弹性伸缩带出节奏，适合录屏、产品演示、结果揭晓后的轻快切段。
框架参数：
  - elasticFocusAt(t, opts)：在主 timeline 的 t 秒触发一次弹簧伸缩转场
  - opts.target：包住底片内容的容器，默认 #efz-stage
  - opts.duration：默认 1s
  - opts.y：第一段从下方向中心回弹，默认 10% 画面高度
  - opts.blurMax：默认 4px，前 60% 保留轻微缩放模糊感
  - opts.restore：默认 true，结束后恢复到原始 transform；做出段转场时可传 false 并在结束点切下一段
技术要点：
  - 这是整帧组合转场，不是常驻镜头工具；预览/单段使用默认回到正常画面，出段转场才停在末态。
  - 关键节奏为 0~20% 拉近回中、20~50% 再次外扩、50~100% 收到较小画幅。
  - 位移、缩放、旋转和短模糊必须同步；前三段使用不同曲线，避免线性或 smoothstep 带来的机械感。
-->
<style>
  #efz-stage {
    position: absolute;
    inset: 0;
    overflow: hidden;
    background: #000;
    transform-origin: 50% 50%;
  }

  .efz-motion {
    position: absolute;
    inset: 0;
    will-change: transform, filter;
  }
</style>

<div id="efz-stage" data-layout-allow-overflow></div>

<script>
  (function () {
    function cubicBezierEase(x1, y1, x2, y2) {
      function value(t) {
        var mt = 1 - t;
        return {
          x: 3 * x1 * mt * mt * t + 3 * x2 * mt * t * t + t * t * t,
          y: 3 * y1 * mt * mt * t + 3 * y2 * mt * t * t + t * t * t,
        };
      }
      return function (p) {
        p = Math.max(0, Math.min(1, p));
        var lo = 0;
        var hi = 1;
        for (var i = 0; i < 14; i++) {
          var mid = (lo + hi) / 2;
          if (value(mid).x > p) hi = mid;
          else lo = mid;
        }
        return value((lo + hi) / 2).y;
      };
    }

    function springDropEase(p) {
      p = Math.max(0, Math.min(1, p));
      if (p === 0 || p === 1) return p;
      var q = p / 2;
      return Math.pow(2, -10 * q) * Math.sin((q - 0.4 / 4) * (2 * Math.PI) / 0.4) + 1;
    }

    var easeSnap = cubicBezierEase(0.215, 0.61, 0.355, 1);
    var easeLift = cubicBezierEase(0.25, 0.46, 0.45, 0.94);
    var easeSettle = cubicBezierEase(0.55, 0.055, 0.675, 0.19);

    function resolveTarget(target) {
      if (target instanceof Element) return target;
      return document.querySelector(target || "#efz-stage");
    }

    function prepareMotionLayer(root) {
      if (!root) return null;
      if (root.classList && root.classList.contains("efz-motion")) return root;
      var existing = root.querySelector(":scope > .efz-motion");
      if (existing) return existing;
      var layer = document.createElement("div");
      layer.className = "efz-motion";
      while (root.firstChild) layer.appendChild(root.firstChild);
      root.appendChild(layer);
      return layer;
    }

    window.elasticFocusAt = function (t, opts) {
      opts = opts || {};
      var container = resolveTarget(opts.target);
      var el = prepareMotionLayer(container);
      if (!el) return null;

      var dur = opts.duration || 1.0;
      var startY = opts.y !== undefined ? opts.y : "10%";
      var blurMax = opts.blurMax !== undefined ? opts.blurMax : 4;
      var local = gsap.timeline();

      local.set(el, {
        transformOrigin: opts.origin || "50% 50%",
        x: 0,
        y: startY,
        scale: opts.startScale || 1.5,
        rotation: opts.startRotation !== undefined ? opts.startRotation : 5,
        filter: "blur(" + blurMax + "px)",
        force3D: true,
      }, 0);

      local.to(el, {
        y: 0,
        scale: 1,
        rotation: 0,
        duration: dur * 0.20,
        ease: springDropEase,
      }, 0);

      local.to(el, {
        scale: opts.overshootScale || 1.3,
        rotation: opts.overshootRotation !== undefined ? opts.overshootRotation : -5,
        duration: dur * 0.30,
        ease: easeLift,
      }, dur * 0.20);

      local.to(el, {
        scale: opts.endScale || 0.8,
        rotation: opts.endRotation || 0,
        duration: dur * 0.50,
        ease: easeSettle,
      }, dur * 0.50);

      local.to(el, {
        filter: "blur(" + Math.max(0.8, blurMax * 0.35).toFixed(2) + "px)",
        duration: dur * 0.60,
        ease: easeSnap,
      }, 0);

      local.to(el, {
        filter: "blur(0px)",
        duration: dur * 0.40,
        ease: easeSettle,
      }, dur * 0.60);

      if (opts.restore !== false) {
        local.set(el, { x: 0, y: 0, scale: 1, rotation: 0, clearProps: "filter" }, dur + 0.02);
      }

      tl.add(local, t);
      return local;
    };

    window.elasticStretchTransitionAt = window.elasticFocusAt;
  })();

  // 演示节奏：一秒内完成伸缩转场
  requestAnimationFrame(function () {
    elasticFocusAt(t0, { duration: 1.0 });
  });
</script>
