<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #stw-bg { position: absolute; inset: 0; background: #0b0d13; overflow: hidden; }
  #stw-wall { position: absolute; left: -15%; top: -12%; width: 135%; height: 130%;
    display: flex; flex-direction: column; justify-content: space-around;
    transform: rotate(-8deg); }
  .stw-row { white-space: nowrap; font-size: 84px; font-weight: 900; letter-spacing: 10px;
    color: transparent; -webkit-text-stroke: 2px rgba(255,255,255,.13); }
  .stw-row.fill { color: rgba(255,255,255,.07); -webkit-text-stroke: 0; }
  /* 居中由 script 里 gsap.set xPercent/yPercent 完成（勿加 CSS transform，避免双重居中冲突） */
  #stw-panel { position: absolute; left: 50%; top: 50%; width: 1660px; height: 920px;
    border-radius: 38px; overflow: hidden;
    border: 3px solid rgba(77,208,225,.8);
    box-shadow: 0 0 0 8px rgba(77,208,225,.14), 0 0 80px rgba(77,208,225,.35), 0 50px 110px rgba(0,0,0,.7);
    background: #14171f; }
  /* 演示内容：实际使用整块替换为 <img> 截图 */
  #stw-mock { position: absolute; inset: 0; padding: 50px; display: grid;
    grid-template-columns: 2fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 24px; }
  .stw-cell { border-radius: 20px; display: flex; flex-direction: column; justify-content: center;
    padding: 0 38px; gap: 10px; }
  .stw-k { font-size: 22px; font-weight: 700; color: rgba(255,255,255,.75); }
  .stw-v { font-size: 64px; font-weight: 900; color: #fff; }


</style>
</head>
<body>
<div id="stage">
<div id="stw" class="clip beat" data-start="0.4" data-duration="5.4" data-track-index="0" data-layout-ignore>
  <div id="stw-bg">
    <div id="stw-wall">
      <div class="stw-row">BRAND · ORIGINAL · BRAND · ORIGINAL · BRAND</div>
      <div class="stw-row fill">ORIGINAL · BRAND · ORIGINAL · BRAND · ORIGINAL</div>
      <div class="stw-row">BRAND · ORIGINAL · BRAND · ORIGINAL · BRAND</div>
      <div class="stw-row fill">ORIGINAL · BRAND · ORIGINAL · BRAND · ORIGINAL</div>
      <div class="stw-row">BRAND · ORIGINAL · BRAND · ORIGINAL · BRAND</div>
    </div>
  </div>
  <div id="stw-panel">
    <div id="stw-mock">
      <div class="stw-cell" style="background:#e5484d"><div class="stw-k">最新作品总播放量</div><div class="stw-v" id="stw-v1">17,806</div></div>
      <div class="stw-cell" style="background:#3e9eff"><div class="stw-k">5s完播率</div><div class="stw-v">49.1</div></div>
      <div class="stw-cell" style="background:#1d2330"><div class="stw-k">点赞</div><div class="stw-v">544</div></div>
      <div class="stw-cell" style="background:#1d2330"><div class="stw-k">时速</div><div class="stw-v" style="color:#ffd24d">245</div></div>
      <div class="stw-cell" style="background:#3e9eff"><div class="stw-k">均时长</div><div class="stw-v">29</div></div>
      <div class="stw-cell" style="background:#ff8a23"><div class="stw-k">最新粉丝数量</div><div class="stw-v">52,100</div></div>
    </div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  /* ===== 全屏截图接管（0.4 起：墙先现 → 容器浮入 → 水印缓移 + 轻推近）===== */
  (function () {
    var t0 = 0.4;
    gsap.set("#stw-panel", { xPercent: -50, yPercent: -50 });
    tl.from("#stw-bg", { autoAlpha: 0, duration: 0.45 }, t0);
    tl.from("#stw-panel", { autoAlpha: 0, scale: 0.88, y: 60, duration: 0.7, ease: "power3.out" }, t0 + 0.25);
    /* 水印墙缓慢平移（全程） */
    tl.to("#stw-wall", { x: -160, duration: 4.6, ease: "none" }, t0 + 0.2);
    /* 驻留期轻微推近强调 */
    tl.to("#stw-panel", { scale: 1.05, duration: 1.6, ease: "power1.inOut" }, t0 + 2.2);
    tl.to(["#stw-panel", "#stw-bg"], { autoAlpha: 0, duration: 0.5, ease: "power2.in" }, t0 + 4.8);
  })();


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
