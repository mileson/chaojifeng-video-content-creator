<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #hpo-wrap { position: absolute; top: 150px; left: 56px; width: 460px; }
  #hpo-scrim { position: absolute; top: -50px; left: -80px; width: 620px; height: 300px;
    background: radial-gradient(ellipse at 30% 45%, rgba(4,6,10,.55) 0%, rgba(4,6,10,0) 72%);
    pointer-events: none; }
  #hpo-title { position: relative; color: #fff; font-size: 30px; font-weight: 900; letter-spacing: 1px;
    text-shadow: 0 2px 14px rgba(0,0,0,.85); }
  #hpo-title .up { color: #46d390; text-shadow: 0 0 18px rgba(70,211,144,.7); }
  #hpo-row { position: relative; margin-top: 22px; display: flex; align-items: center; gap: 14px; }
  #hpo-label { color: #93a0b4; font-size: 16px; font-weight: 700; letter-spacing: 2px; flex: none;
    text-shadow: 0 2px 10px rgba(0,0,0,.85); }
  #hpo-track { flex: 1; height: 12px; border-radius: 6px; background: rgba(255,255,255,.14); overflow: hidden; }
  #hpo-fill { height: 100%; width: 100%; border-radius: 6px; transform-origin: left center;
    background: linear-gradient(90deg, #2da06c, #5ee3a1); box-shadow: 0 0 16px rgba(70,211,144,.6); }
  #hpo-arrow { color: #46d390; font-size: 24px; font-weight: 900; flex: none;
    text-shadow: 0 0 14px rgba(70,211,144,.8); }
  #hpo-chips { position: relative; margin-top: 22px; display: flex; gap: 12px; }
  .hpo-chip { padding: 8px 20px; border-radius: 999px; font-size: 18px; font-weight: 800;
    color: #dfe6f2; background: rgba(8,10,16,.55); border: 1px solid rgba(255,255,255,.3);
    text-shadow: 0 1px 8px rgba(0,0,0,.7); }


</style>
</head>
<body>
<div id="stage">
<div id="hpo" class="clip beat" data-start="0.4" data-duration="4.8" data-track-index="0" data-layout-allow-overflow>
  <div id="hpo-wrap">
    <div id="hpo-scrim"></div>
    <div id="hpo-title">样本库 <span class="up">↑</span> · 预测越来越准</div>
    <div id="hpo-row">
      <div id="hpo-label">准确度</div>
      <div id="hpo-track"><div id="hpo-fill"></div></div>
      <div id="hpo-arrow">↗</div>
    </div>
    <div id="hpo-chips"><div class="hpo-chip">自主学习</div><div class="hpo-chip">自我迭代</div></div>
  </div>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  /* ===== 无卡成长进度条（0.4 起，fill 生长 78%）===== */
  (function () {
    var t0 = 0.4;
    tl.from("#hpo-scrim", { autoAlpha: 0, duration: 0.5 }, t0);
    tl.from("#hpo-title", { autoAlpha: 0, y: 20, duration: 0.5 }, t0 + 0.05);
    tl.fromTo("#hpo-title .up", { y: 6 }, { y: -4, duration: 0.4, yoyo: true, repeat: 3, ease: "sine.inOut" }, t0 + 0.5);
    tl.from("#hpo-row", { autoAlpha: 0, duration: 0.4 }, t0 + 0.45);
    tl.fromTo("#hpo-fill", { scaleX: 0 }, { scaleX: 0.78, duration: 1.1, ease: "power2.out" }, t0 + 0.6);
    tl.from("#hpo-arrow", { autoAlpha: 0, x: -10, y: 10, duration: 0.4, ease: "back.out(2)" }, t0 + 1.5);
    tl.from(".hpo-chip", { autoAlpha: 0, scale: 0.5, duration: 0.4, ease: "back.out(1.8)", stagger: 0.18 }, t0 + 1.2);
    tl.to("#hpo-wrap", { autoAlpha: 0, x: -26, duration: 0.4, ease: "power2.in" }, t0 + 4.2);
  })();


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
