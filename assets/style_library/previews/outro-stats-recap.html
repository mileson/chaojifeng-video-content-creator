<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #osr-bg { position: absolute; inset: 0;
    background: radial-gradient(130% 100% at 50% 0%, #16233a 0%, #0b121e 58%, #070b13 100%); }
  #osr-head { position: absolute; left: 50%; top: 130px; transform: translateX(-50%); text-align: center; }
  #osr-kicker { color: #4dd0e1; font-size: 22px; font-weight: 800; letter-spacing: 8px; }
  #osr-title { color: #f4f7ff; font-size: 52px; font-weight: 900; margin-top: 10px; }
  #osr-grid { position: absolute; left: 50%; top: 360px; transform: translateX(-50%);
    display: grid; grid-template-columns: repeat(4, 360px); }
  .osr-cell { padding: 22px 26px; text-align: center; position: relative; }
  .osr-cell + .osr-cell::before { content: ""; position: absolute; left: 0; top: 22px; bottom: 22px;
    width: 1px; background: rgba(255,255,255,.14); }
  .osr-val { font-size: 76px; font-weight: 900; letter-spacing: 1px;
    text-shadow: 0 2px 18px rgba(0,0,0,.55); }
  .osr-val small { font-size: 28px; font-weight: 800; margin-left: 5px; }
  .osr-label { color: #9aa8c0; font-size: 22px; font-weight: 700; margin-top: 14px;
    text-shadow: 0 2px 10px rgba(0,0,0,.5); }
  #osr-c1 .osr-val { color: #3e9eff; } #osr-c2 .osr-val { color: #46d390; }
  #osr-c3 .osr-val { color: #ffb224; } #osr-c4 .osr-val { color: #e5484d; }
  #osr-quote { position: absolute; left: 50%; bottom: 120px; transform: translateX(-50%);
    color: #aab6cc; font-size: 28px; font-weight: 700; white-space: nowrap; }
  #osr-quote b { color: #4dd0e1; }


</style>
</head>
<body>
<div id="stage">
<div id="osr-bg" data-layout-allow-overflow></div>
<div id="osr-head">
  <div id="osr-kicker">BEHIND THIS VIDEO</div>
  <div id="osr-title">这期视频背后的数字</div>
</div>
<div id="osr-grid">
  <div class="osr-cell" id="osr-c1"><div class="osr-val"><span id="osr-v1">0</span><small>行</small></div>
    <div class="osr-label">AI 生成的特效代码</div></div>
  <div class="osr-cell" id="osr-c2"><div class="osr-val"><span id="osr-v2">0</span><small>万</small></div>
    <div class="osr-label">消耗 Token 数</div></div>
  <div class="osr-cell" id="osr-c3"><div class="osr-val"><span id="osr-v3">0</span><small>h</small></div>
    <div class="osr-label">从想法到成片</div></div>
  <div class="osr-cell" id="osr-c4"><div class="osr-val"><span id="osr-v4">0</span><small>个</small></div>
    <div class="osr-label">踩过的坑（都帮你踩了）</div></div>
</div>
<div id="osr-quote">每一期都是一次 <b>Build in Public</b> · 下期继续</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  tl.from("#osr-bg", { autoAlpha: 0, duration: 0.6 }, t0);
  tl.from(["#osr-kicker", "#osr-title"], { autoAlpha: 0, y: 22, duration: 0.5, stagger: 0.12 }, t0 + 0.35);
  tl.from(".osr-cell", { autoAlpha: 0, y: 46, scale: 0.92, duration: 0.5,
    ease: "back.out(1.5)", stagger: 0.15 }, t0 + 0.9);
  countUp("#osr-v1", 2400, 1.4, t0 + 1.1);
  countUp("#osr-v2", 86, 1.4, t0 + 1.25);
  countUp("#osr-v3", 6, 1.2, t0 + 1.4);
  countUp("#osr-v4", 9, 1.2, t0 + 1.55);
  tl.from("#osr-quote", { autoAlpha: 0, y: 22, duration: 0.5 }, t0 + 3.0);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
