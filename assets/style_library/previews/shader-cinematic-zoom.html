<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #cz-scene { position: absolute; inset: 0; background: transparent; opacity: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.56vw; }
  #cz-num { font: 600 1.56vw/1 "PingFang SC", sans-serif; color: #3e9eff; letter-spacing: 0.73vw; text-shadow: 0 0.14em 0.5em rgba(0,0,0,.86); }
  #cz-title { font: 800 5.73vw/1.2 "PingFang SC", sans-serif; color: #ffffff; letter-spacing: 0.31vw; text-shadow: 0 0.08em 0.35em rgba(0,0,0,.9); }
  #cz-en { font: 500 1.35vw/1 "PingFang SC", sans-serif; color: #d5d7df; letter-spacing: 0.52vw; text-shadow: 0 0.14em 0.5em rgba(0,0,0,.86); }
  @media (max-aspect-ratio: 4/5) {
    #cz-scene { gap: 3.5vw; }
    #cz-num { font-size: 3.9vw; letter-spacing: 1.6vw; }
    #cz-title { font-size: 11vw; letter-spacing: 0.7vw; }
    #cz-en { font-size: 3.2vw; letter-spacing: 1.1vw; }
  }


</style>
</head>
<body>
<div id="stage">
<div style="position:absolute;inset:0;background:#07080c"></div>
  <div id="wp-scene" style="position:absolute;inset:0;background:#0a1020;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px">
    <div style="font:600 30px/1 'PingFang SC',sans-serif;color:#3e9eff;letter-spacing:14px">CHAPTER · 01</div>
    <div style="font:800 110px/1.2 'PingFang SC',sans-serif;color:#ffffff;letter-spacing:6px">横甩切换</div>
    <div style="font:500 26px/1 'PingFang SC',sans-serif;color:#8b93a8;letter-spacing:10px">WHIP PAN</div>
  </div>
  <canvas id="wp-canvas" width="1920" height="1080" style="position:absolute;inset:0;opacity:0;display:block"></canvas>
  <div id="ir-scene" style="position:absolute;inset:0;background:#120e08;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px">
    <div style="font:600 30px/1 'PingFang SC',sans-serif;color:#ffb224;letter-spacing:14px">CHAPTER · 02</div>
    <div style="font:800 110px/1.2 'PingFang SC',sans-serif;color:#ffffff;letter-spacing:6px">金圈虹膜</div>
    <div style="font:500 26px/1 'PingFang SC',sans-serif;color:#8b93a8;letter-spacing:10px">SDF IRIS</div>
  </div>
  <canvas id="ir-canvas" width="1920" height="1080" style="position:absolute;inset:0;opacity:0;display:block"></canvas>
  <div id="cz-scene" style="position:absolute;inset:0;background:#0a1418;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px">
    <div style="font:600 30px/1 'PingFang SC',sans-serif;color:#4dd0e1;letter-spacing:14px">CHAPTER · 03</div>
    <div style="font:800 110px/1.2 'PingFang SC',sans-serif;color:#ffffff;letter-spacing:6px">变焦转场</div>
    <div style="font:500 26px/1 'PingFang SC',sans-serif;color:#8b93a8;letter-spacing:10px">CINEMATIC ZOOM</div>
  </div>
  <canvas id="cz-canvas" width="1920" height="1080" style="position:absolute;inset:0;opacity:0;display:block"></canvas>
  <div id="fw-scene" style="position:absolute;inset:0;background:#14101e;opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px">
    <div style="font:600 30px/1 'PingFang SC',sans-serif;color:#b388ff;letter-spacing:14px">CHAPTER · 04</div>
    <div style="font:800 110px/1.2 'PingFang SC',sans-serif;color:#ffffff;letter-spacing:6px">闪白转场</div>
    <div style="font:500 26px/1 'PingFang SC',sans-serif;color:#8b93a8;letter-spacing:10px">FLASH WHITE</div>
  </div>
  <canvas id="fw-canvas" width="1920" height="1080" style="position:absolute;inset:0;opacity:0;display:block"></canvas>
<div data-layout-ignore style="position: absolute; inset: 0">
  <div id="cz-scene">
    <div id="cz-num">【cz_num】</div>
    <div id="cz-title">【cz_title】</div>
    <div id="cz-en">【cz_en】</div>
  </div>
  <canvas id="cz-canvas" style="position: absolute; inset: 0; opacity: 0; display: block"></canvas>
</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

(function () {
  var W = window.innerWidth || 1920, H = window.innerHeight || 1080;
  var canvas = document.getElementById("cz-canvas");
  canvas.width = W; canvas.height = H;
  var tlBeat = (typeof tl !== "undefined" && tl) ? tl : gsap.timeline();
  var czEnd = (typeof tEnd !== "undefined" && tEnd) ? tEnd : 3.5;
  var r = czEnd / 3.5;
  var gl = canvas.getContext("webgl", { alpha: true, premultipliedAlpha: false, preserveDrawingBuffer: true });
  if (!gl) {
    // 无 WebGL 降级：透明背景上的普通章节文字
    tlBeat.to("#cz-scene", { opacity: 1, duration: 0.3 * r }, 0.2 * r);
    tlBeat.to("#cz-scene", { opacity: 0, duration: 0.3 * r }, 3.0 * r);
    return;
  }
  gl.viewport(0, 0, W, H);

  function texFromCanvas2D(c) {
    var tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, c);
    return tex;
  }
  function captureScene() {
    var scene = document.getElementById("cz-scene");
    scene.style.opacity = "1";
    scene.offsetHeight;
    var c = document.createElement("canvas");
    c.width = W; c.height = H;
    var ctx = c.getContext("2d");
    var sr = scene.getBoundingClientRect();
    var sx = W / sr.width, sy = H / sr.height;
    scene.querySelectorAll("*").forEach(function (el) {
      var cs = window.getComputedStyle(el);
      if (cs.display === "none" || cs.visibility === "hidden") return;
      var rect = el.getBoundingClientRect();
      if (rect.width < 1 || rect.height < 1) return;
      var x = (rect.left - sr.left) * sx, y = (rect.top - sr.top) * sy;
      var w = rect.width * sx, h = rect.height * sy;
      var bg = cs.backgroundColor;
      if (bg && bg !== "rgba(0, 0, 0, 0)" && bg !== "transparent") {
        ctx.fillStyle = bg; ctx.fillRect(x, y, w, h);
      }
      var text = "";
      el.childNodes.forEach(function (n) { if (n.nodeType === 3) text += n.textContent; });
      text = text.trim();
      if (text && !el.querySelector("div,span")) {
        ctx.font = cs.fontWeight + " " + parseFloat(cs.fontSize) + "px " + cs.fontFamily;
        ctx.fillStyle = cs.color;
        if (cs.letterSpacing && cs.letterSpacing !== "normal")
          ctx.letterSpacing = parseFloat(cs.letterSpacing) + "px";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.save();
        ctx.shadowColor = "rgba(0,0,0,.82)";
        ctx.shadowBlur = Math.max(4, parseFloat(cs.fontSize) * .16);
        ctx.shadowOffsetY = Math.max(2, parseFloat(cs.fontSize) * .04);
        ctx.strokeStyle = "rgba(0,0,0,.55)";
        ctx.lineWidth = Math.max(2, parseFloat(cs.fontSize) * .045);
        ctx.lineJoin = "round";
        ctx.strokeText(text, x + w / 2, y + h / 2);
        ctx.fillText(text, x + w / 2, y + h / 2);
        ctx.restore();
      }
    });
    scene.style.opacity = "0";
    return texFromCanvas2D(c);
  }
  function transparentTexture() {
    var tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([0, 0, 0, 0]));
    return tex;
  }

  var vertSrc = "attribute vec2 a_pos; varying vec2 v_uv; void main(){v_uv=a_pos*0.5+0.5; v_uv.y=1.0-v_uv.y; gl_Position=vec4(a_pos,0,1);}";
  var quadBuf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  function compile(src, type) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  }
  function mkProg(fragSrc) {
    var p = gl.createProgram();
    gl.attachShader(p, compile(vertSrc, gl.VERTEX_SHADER));
    gl.attachShader(p, compile(fragSrc, gl.FRAGMENT_SHADER));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
    return p;
  }
  var HH = "precision mediump float;varying vec2 v_uv;uniform sampler2D u_from,u_to;uniform float u_progress;uniform vec2 u_resolution;\n";
  var progPass = mkProg(HH + "void main(){gl_FragColor=texture2D(u_from,v_uv);}");
  // FRAG_CZ：透明章节文字的径向变焦拖影 + RGB 微色散 + 轻量中心光
  var progTrans = mkProg(HH + "void main(){vec2 d=v_uv-vec2(.5);float fromS=u_progress*.08;float toS=(1.-u_progress)*.06;vec4 fromBl=vec4(0.);vec4 toBl=vec4(0.);for(int i=0;i<12;i++){float f=float(i)/12.;vec4 fa=texture2D(u_from,v_uv-d*(fromS*1.06)*f);vec4 fg=texture2D(u_from,v_uv-d*fromS*f);vec4 fb=texture2D(u_from,v_uv-d*(fromS*.94)*f);fromBl+=vec4(fa.r,fg.g,fb.b,max(fa.a,max(fg.a,fb.a)));vec4 ta=texture2D(u_to,v_uv+d*(toS*1.06)*f);vec4 tg=texture2D(u_to,v_uv+d*toS*f);vec4 tb=texture2D(u_to,v_uv+d*(toS*.94)*f);toBl+=vec4(ta.r,tg.g,tb.b,max(ta.a,max(tg.a,tb.a)));}fromBl/=12.;toBl/=12.;vec4 content=mix(fromBl,toBl,u_progress);vec2 auv=d*vec2(u_resolution.x/u_resolution.y,1.);float pulse=sin(u_progress*3.14159265);float glow=exp(-length(auv)*7.)*pulse*.16;float outA=1.-(1.-content.a)*(1.-glow);vec3 outRGB=content.rgb+vec3(.22,.58,1.)*glow;gl_FragColor=vec4(outRGB,outA);}");

  function renderShader(prog, texFrom, texTo, p) {
    gl.useProgram(prog);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texFrom);
    gl.uniform1i(gl.getUniformLocation(prog, "u_from"), 0);
    gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texTo);
    gl.uniform1i(gl.getUniformLocation(prog, "u_to"), 1);
    gl.uniform1f(gl.getUniformLocation(prog, "u_progress"), p);
    gl.uniform2f(gl.getUniformLocation(prog, "u_resolution"), W, H);
    var pos = gl.getAttribLocation(prog, "a_pos");
    gl.bindBuffer(gl.ARRAY_BUFFER, quadBuf);
    gl.enableVertexAttribArray(pos);
    gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  }

  var texScene = captureScene();
  var texTransparent = transparentTexture();
  renderShader(progPass, texTransparent, texTransparent, 0);

  var st = { p: 0 };
  tlBeat.to("#cz-canvas", { autoAlpha: 1, duration: 0.25 * r, ease: "power2.in" }, 0);
  tlBeat.to(st, { p: 1, duration: 0.7 * r, ease: "power2.out",
    onUpdate: function () { renderShader(progTrans, texTransparent, texScene, st.p); } }, 0.25 * r);
  tlBeat.to(st, { p: 1, duration: 0.7 * r, ease: "power2.in", startAt: { p: 0 },
    onUpdate: function () { renderShader(progTrans, texScene, texTransparent, st.p); },
    onComplete: function () { renderShader(progPass, texTransparent, texTransparent, 0); } }, 2.55 * r);
  tlBeat.to("#cz-canvas", { autoAlpha: 0, duration: 0.25 * r, ease: "power2.out" }, 3.25 * r);
})();

var m = window.__timelines && window.__timelines["shader4"];if (m) { m.vars.paused = false; m.pause(); gsap.fromTo(m, { time: 8.5 }, { time: 12.0, duration: 3.5, ease: 'none', repeat: -1, repeatDelay: 0.5 }); }
  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
