<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #sfm-dim { position: absolute; inset: 0; pointer-events: none;
    --sx: 960px; --sy: 540px; --sr: 240px;
    background: radial-gradient(circle var(--sr) at var(--sx) var(--sy),
      transparent 0%, transparent calc(100% - 90px), rgba(5,8,14,.72) 100%); }
  #sfm-ring { position: absolute; left: 0; top: 0; width: 0; height: 0; border-radius: 50%;
    border: 2.5px solid rgba(62,158,255,.85); box-shadow: 0 0 28px rgba(62,158,255,.4);
    transform: translate(-50%, -50%); pointer-events: none; }


</style>
</head>
<body>
<div id="stage">
<div style="position:absolute;inset:0;background:linear-gradient(150deg,#26304a 0%,#161d30 100%)"></div><div style="position:absolute;left:1310px;top:250px;padding:14px 34px;border-radius:14px;background:#3e9eff;color:#06121f;font:800 30px/1 sans-serif">主按钮</div><div style="position:absolute;left:280px;top:620px;width:480px;height:270px;border-radius:20px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.16);display:flex;align-items:center;justify-content:center;color:#9fb0c8;font:700 30px/1 sans-serif">设置面板</div>
<div id="sfm-dim" data-layout-ignore></div>
<div id="sfm-ring" data-layout-ignore></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  (function () {
    var v = { x: 960, y: 540, r: 240 };
    function apply() {
      gsap.set("#sfm-dim", { "--sx": v.x + "px", "--sy": v.y + "px", "--sr": v.r + "px" });
      gsap.set("#sfm-ring", { left: v.x, top: v.y, width: v.r * 2, height: v.r * 2 });
    }
    window.spotTo = function (t, x, y, r, dur) {
      tl.to(v, { x: x, y: y, r: r || 240, duration: dur || 0.7, ease: "power2.inOut", onUpdate: apply }, t);
      tl.fromTo("#sfm-ring", { boxShadow: "0 0 28px rgba(62,158,255,.4)" },
        { boxShadow: "0 0 52px rgba(62,158,255,.9)", duration: 0.35, yoyo: true, repeat: 1 }, t + (dur || 0.7));
    };
    window.spotOff = function (t) {
      tl.to(["#sfm-dim", "#sfm-ring"], { autoAlpha: 0, duration: 0.5 }, t);
    };
    apply();
    tl.from(["#sfm-dim", "#sfm-ring"], { autoAlpha: 0, duration: 0.5 }, t0);
  })();
  // 演示：中央 → 右上按钮（小圈） → 左下面板（大圈） → 收
  spotTo(t0 + 1.0, 1430, 300, 150);
  spotTo(t0 + 2.8, 520, 760, 300);
  spotOff(t0 + 5.0);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
