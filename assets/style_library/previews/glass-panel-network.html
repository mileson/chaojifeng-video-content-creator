<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; overflow: hidden; background: transparent; }
  #stage { position: relative; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(90% 70% at 70% 20%, rgba(62,158,255,.10), transparent 60%),
      radial-gradient(80% 60% at 20% 85%, rgba(77,208,225,.07), transparent 60%),
      linear-gradient(135deg, #161c2a 0%, #0e1320 100%); }
  .img-fallback { background: linear-gradient(135deg, #2a3447, #1b2333) !important;
    display: flex; align-items: center; justify-content: center; }

  #gpn-bg { position: absolute; inset: 0; background: linear-gradient(160deg, rgba(13,17,23,.92), rgba(26,34,51,.92)); }
  #gpn-svg { position: absolute; inset: 0; overflow: visible; }
  .gpn-panel { position: absolute; background: rgba(20,28,42,.72); border: 1.5px solid rgba(77,208,225,.4);
    border-radius: 16px; box-shadow: 0 0 40px rgba(77,208,225,.12), 0 24px 60px rgba(0,0,0,.5); padding: 20px 24px; }
  .gpn-h { color: #4dd0e1; font-size: 15px; font-weight: 800; letter-spacing: 3px; }
  .gpn-line { height: 10px; border-radius: 5px; background: rgba(255,255,255,.14); margin-top: 12px; }
  #gpn-pa { left: 250px; top: 200px; width: 380px; transform: rotate(-1.2deg); }
  #gpn-pb { left: 820px; top: 140px; width: 340px; transform: rotate(.8deg); }
  #gpn-pc { left: 1310px; top: 300px; width: 330px; transform: rotate(-0.8deg); }
  #gpn-pd { left: 560px; top: 580px; width: 420px; transform: rotate(.6deg); }
  #gpn-pe { left: 1150px; top: 650px; width: 350px; transform: rotate(-1deg); }
  #gpn-title { position: absolute; left: 0; right: 0; top: 64px; text-align: center; }
  #gpn-title span { display: inline-block; background: rgba(10,14,22,.88); color: #fff; border: 1px solid rgba(255,255,255,.16);
    border-radius: 12px; padding: 12px 30px; font-size: 24px; font-weight: 900; }
  #gpn-title em { color: #4dd0e1; font-style: normal; }


</style>
</head>
<body>
<div id="stage">
<div id="gpn-bg" data-layout-ignore></div>
<div id="gpn-title"><span>【网络标题 · 】<em>【高亮】</em></span></div>
<svg id="gpn-svg" viewBox="0 0 1920 1080">
  <path id="gpn-e1" d="M 630,260 C 700,240 750,230 820,220" fill="none" stroke="rgba(77,208,225,.7)" stroke-width="3" stroke-dasharray="6 10" stroke-linecap="round"/>
  <path id="gpn-e2" d="M 1160,230 C 1230,250 1260,280 1310,330" fill="none" stroke="rgba(77,208,225,.7)" stroke-width="3" stroke-dasharray="6 10" stroke-linecap="round"/>
  <path id="gpn-e3" d="M 820,340 C 760,430 720,500 680,580" fill="none" stroke="rgba(255,122,89,.7)" stroke-width="3" stroke-dasharray="6 10" stroke-linecap="round"/>
  <path id="gpn-e4" d="M 980,660 C 1040,670 1090,680 1150,700" fill="none" stroke="rgba(77,208,225,.7)" stroke-width="3" stroke-dasharray="6 10" stroke-linecap="round"/>
  <path id="gpn-e5" d="M 1450,420 C 1420,490 1390,560 1350,650" fill="none" stroke="rgba(255,122,89,.7)" stroke-width="3" stroke-dasharray="6 10" stroke-linecap="round"/>
</svg>
<div class="gpn-panel" id="gpn-pa"><div class="gpn-h">【模块A · 说明】</div><div class="gpn-line" style="width:84%"></div><div class="gpn-line" style="width:60%"></div></div>
<div class="gpn-panel" id="gpn-pb"><div class="gpn-h">【模块B · 说明】</div><div class="gpn-line" style="width:74%"></div><div class="gpn-line" style="width:88%"></div></div>
<div class="gpn-panel" id="gpn-pc"><div class="gpn-h">【模块C · 说明】</div><div class="gpn-line" style="width:66%"></div><div class="gpn-line" style="width:80%"></div></div>
<div class="gpn-panel" id="gpn-pd"><div class="gpn-h">【模块D · 说明】</div><div class="gpn-line" style="width:90%"></div><div class="gpn-line" style="width:72%"></div></div>
<div class="gpn-panel" id="gpn-pe"><div class="gpn-h">【模块E · 说明】</div><div class="gpn-line" style="width:70%"></div><div class="gpn-line" style="width:58%"></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/SplitText.min.js"></script>

<script>
  (function fit() {
    var s = window.innerWidth / 1920;
    var st = document.getElementById("stage");
    st.style.transform = "scale(" + s + ")";
    document.body.style.height = (1080 * s) + "px";
    window.addEventListener("resize", fit);
  })();
  // 缺失截图素材兜底为渐变占位（不影响真实 logo 等存在的资产）
  document.querySelectorAll("img").forEach(function (im) {
    var ph = function () { im.classList.add("img-fallback"); im.removeAttribute("src"); };
    im.addEventListener("error", ph);
    if (im.complete && im.naturalWidth === 0 && im.getAttribute("src")) ph();
  });
  var tl = gsap.timeline({ repeat: -1, repeatDelay: 0.5, defaults: { ease: "power3.out" } });
  var t0 = 0.4;
  var tEnd = 5.4;
  // snippet 通用上下文工具（工程里由 composition 提供，预览页内置）
  function countUp(sel, end, dur, at, decimals, suffix) {
    var obj = { v: 0 }, el = document.querySelector(sel);
    tl.to(obj, { v: end, duration: dur, ease: "power1.out",
      onUpdate: function () { el.textContent = obj.v.toFixed(decimals || 0) + (suffix || ""); } }, at);
  }
  if (!window.attachMotionBlur) window.attachMotionBlur = function () {};
  try {

  tl.from("#gpn-bg", { autoAlpha: 0, duration: 0.4 }, t0);
  tl.from("#gpn-title", { autoAlpha: 0, y: -20, duration: 0.4 }, t0 + 0.25);
  tl.from(".gpn-panel", { autoAlpha: 0, y: 40, scale: 0.92, duration: 0.5, ease: "back.out(1.6)", stagger: 0.16 }, t0 + 0.4);
  ["#gpn-e1", "#gpn-e2", "#gpn-e3", "#gpn-e4", "#gpn-e5"].forEach(function (sel, i) {
    var p = document.querySelector(sel);
    var len = p.getTotalLength();
    gsap.set(p, { attr: { "stroke-dasharray": len, "stroke-dashoffset": len } });
    tl.to(p, { attr: { "stroke-dashoffset": 0 }, duration: 0.55, ease: "power2.inOut" }, t0 + 1.4 + i * 0.18);
  });
  tl.to(".gpn-panel", { boxShadow: "0 0 60px rgba(77,208,225,.28), 0 24px 60px rgba(0,0,0,.5)", duration: 0.7, yoyo: true, repeat: 1, stagger: 0.1, ease: "sine.inOut" }, t0 + 2.6);
  tl.to(["#gpn-bg", "#gpn-title", ".gpn-panel", "#gpn-svg"], { autoAlpha: 0, duration: 0.5, ease: "power2.in" }, t0 + 4.9);


  } catch (e) {
    document.getElementById("stage").innerHTML =
      '<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8b93a3;font-size:40px;font-weight:700">该模式需在工程内预览（' + e.message + '）</div>';
  }
  // snippet 自带的顶层 timeline 统一循环：paused 的（shader 系）play 起来，
  // 一次性的（const b = gsap.timeline()）也续命循环，预览永不停在退场后的空白态
  gsap.globalTimeline.getChildren(false, false, true).forEach(function (t) {
    if (t === tl || !t.repeat) return;
    t.repeat(-1); t.repeatDelay(0.8);
    if (t.vars && t.vars.paused) t.play(0);
    // 随机起始相位：避免网格里所有预览同相位循环（同一瞬间集体空白）
    if (t.duration() > 1) t.time(t.duration() * (0.15 + Math.random() * 0.5));
  });
  // 预览 wrapper 主 timeline 也随机相位
  if (tl.duration() > 1) tl.time(tl.duration() * (0.15 + Math.random() * 0.5));
</script>
</body>
</html>
